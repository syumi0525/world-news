name: Update WORLD NEWS data

on:
  workflow_dispatch:
  schedule:
    - cron: "*/10 * * * *"

permissions:
  contents: write

jobs:
  update-world-data:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Update WORLD NEWS
        run: |
          python - <<'PY'
          import csv
          import gzip
          import io
          import json
          import os
          import random
          import urllib.request
          from datetime import datetime, timezone

          UA = "WORLD-NEWS/1.0"

          def fetch_json(url):
              req = urllib.request.Request(
                  url,
                  headers={
                      "User-Agent": UA,
                      "Accept": "application/json",
                  },
              )

              with urllib.request.urlopen(
                  req,
                  timeout=30
              ) as response:
                  return json.loads(
                      response.read().decode("utf-8")
                  )

          def fetch_bytes(url):
              req = urllib.request.Request(
                  url,
                  headers={
                      "User-Agent": UA
                  },
              )

              with urllib.request.urlopen(
                  req,
                  timeout=60
              ) as response:
                  return response.read()

          def download(url, path):
              data = fetch_bytes(url)

              if len(data) < 1000:
                  raise RuntimeError(
                      "Downloaded image is too small."
                  )

              with open(path, "wb") as f:
                  f.write(data)

          def clean(value, default=""):
              if value is None:
                  return default

              return str(value).strip()

          def number(value):
              try:
                  if value is None:
                      return None

                  text = str(value).strip()

                  if not text:
                      return None

                  return float(text)

              except Exception:
                  return None

          def find_value(row, names):
              for name in names:
                  if name in row:
                      value = row[name]

                      if (
                          value is not None
                          and str(value).strip() != ""
                      ):
                          return value

              return None

          def make_weather(row):
              lat = number(
                  find_value(
                      row,
                      [
                          "latitude",
                          "lat"
                      ]
                  )
              )

              lon = number(
                  find_value(
                      row,
                      [
                          "longitude",
                          "lon"
                      ]
                  )
              )

              station = clean(
                  find_value(
                      row,
                      [
                          "station_id",
                          "icaoId",
                          "station"
                      ]
                  )
              )

              name = clean(
                  find_value(
                      row,
                      [
                          "station_name",
                          "name"
                      ]
                  )
              )

              weather = clean(
                  find_value(
                      row,
                      [
                          "wx_string",
                          "wxString",
                          "weather"
                      ]
                  ),
                  "No coded weather"
              )

              temperature = number(
                  find_value(
                      row,
                      [
                          "temp_c",
                          "temp",
                          "temperature"
                      ]
                  )
              )

              dewpoint = number(
                  find_value(
                      row,
                      [
                          "dewpoint_c",
                          "dewp",
                          "dewpoint"
                      ]
                  )
              )

              wind_speed = number(
                  find_value(
                      row,
                      [
                          "wind_speed_kt",
                          "wspd",
                          "windSpeed"
                      ]
                  )
              )

              wind_direction = number(
                  find_value(
                      row,
                      [
                          "wind_dir_degrees",
                          "wdir",
                          "windDirection"
                      ]
                  )
              )

              visibility = clean(
                  find_value(
                      row,
                      [
                          "visibility_statute_mi",
                          "visib",
                          "visibility"
                      ]
                  ),
                  "N/A"
              )

              flight_category = clean(
                  find_value(
                      row,
                      [
                          "flight_category",
                          "fltCat",
                          "flightCategory"
                      ]
                  ),
                  "N/A"
              )

              observation_time = clean(
                  find_value(
                      row,
                      [
                          "observation_time",
                          "obsTime",
                          "observationTime"
                      ]
                  )
              )

              raw = clean(
                  find_value(
                      row,
                      [
                          "raw_text",
                          "rawOb",
                          "raw"
                      ]
                  )
              )

              return {
                  "name": name or station or "Unknown",
                  "station": station,
                  "lat": lat,
                  "lon": lon,
                  "weather": weather,
                  "temperature": temperature,
                  "dewpoint": dewpoint,
                  "windSpeed": wind_speed,
                  "windDirection": wind_direction,
                  "visibility": visibility,
                  "flightCategory": flight_category,
                  "observationTime": observation_time,
                  "raw": raw
              }

          generated = datetime.now(
              timezone.utc
          ).isoformat()

          # ============================================================
          # METAR
          # ============================================================

          metar_cache_url = (
              "https://aviationweather.gov/"
              "data/cache/metars.cache.csv.gz"
          )

          print("")
          print("================================")
          print("FETCHING METAR CACHE")
          print("================================")
          print(metar_cache_url)

          compressed = fetch_bytes(
              metar_cache_url
          )

          print(
              "Compressed bytes:",
              len(compressed)
          )

          csv_bytes = gzip.decompress(
              compressed
          )

          print(
              "CSV bytes:",
              len(csv_bytes)
          )

          csv_text = csv_bytes.decode(
              "utf-8-sig",
              errors="replace"
          )

          reader = csv.DictReader(
              io.StringIO(csv_text)
          )

          print(
              "CSV columns:",
              reader.fieldnames
          )

          valid_rows = []

          for row in reader:

              if not row:
                  continue

              weather = make_weather(
                  row
              )

              if not weather["station"]:
                  continue

              if weather["lat"] is None:
                  continue

              if weather["lon"] is None:
                  continue

              if (
                  weather["lat"] < -90
                  or
                  weather["lat"] > 90
              ):
                  continue

              if (
                  weather["lon"] < -180
                  or
                  weather["lon"] > 180
              ):
                  continue

              valid_rows.append(
                  weather
              )

          print(
              "Valid METAR stations:",
              len(valid_rows)
          )

          if len(valid_rows) < 2:
              raise RuntimeError(
                  "Not enough valid METAR stations."
              )

          random.shuffle(
              valid_rows
          )

          atmosphere_data = (
              valid_rows[0]
          )

          random_place_data = (
              valid_rows[1]
          )

          print("")
          print(
              "ATMOSPHERE:",
              atmosphere_data
          )

          print(
              "RANDOM PLACE:",
              random_place_data
          )

          if (
              random_place_data["lat"] is None
              or
              random_place_data["lon"] is None
          ):
              raise RuntimeError(
                  "Random Place has no coordinates."
              )

          # ============================================================
          # NOAA SPACE WEATHER
          # 現在のNOAA SWPC公開エンドポイント
          # ============================================================

          solar_speed_url = (
              "https://services.swpc.noaa.gov/"
              "products/summary/"
              "solar-wind-speed.json"
          )

          magnetic_url = (
              "https://services.swpc.noaa.gov/"
              "products/summary/"
              "solar-wind-mag-field.json"
          )

          kp_url = (
              "https://services.swpc.noaa.gov/"
              "products/"
              "noaa-planetary-k-index.json"
          )

          flux_url = (
              "https://services.swpc.noaa.gov/"
              "products/summary/"
              "10cm-flux.json"
          )

          print("")
          print("================================")
          print("FETCHING NOAA SPACE WEATHER")
          print("================================")

          print(
              "Solar Wind:",
              solar_speed_url
          )

          solar_speed_raw = fetch_json(
              solar_speed_url
          )

          print(
              "Magnetic Field:",
              magnetic_url
          )

          magnetic_raw = fetch_json(
              magnetic_url
          )

          print(
              "Kp:",
              kp_url
          )

          kp_raw = fetch_json(
              kp_url
          )

          print(
              "10cm Flux:",
              flux_url
          )

          flux_raw = fetch_json(
              flux_url
          )

          def latest_row(data):
              if isinstance(data, dict):
                  return data

              if not isinstance(
                  data,
                  list
              ):
                  return {}

              for row in reversed(data):

                  if isinstance(
                      row,
                      dict
                  ):
                      return row

              return {}

          def val(obj, *keys):
              for key in keys:

                  if (
                      isinstance(obj, dict)
                      and
                      key in obj
                  ):
                      return obj[key]

              return None

          solar_speed = latest_row(
              solar_speed_raw
          )

          magnetic = latest_row(
              magnetic_raw
          )

          kp_rows = (
              kp_raw
              if isinstance(
                  kp_raw,
                  list
              )
              else [kp_raw]
          )

          kp_rows = [
              row
              for row in kp_rows
              if isinstance(
                  row,
                  dict
              )
          ]

          kp = (
              kp_rows[-1]
              if kp_rows
              else {}
          )

          flux = latest_row(
              flux_raw
          )

          solar_wind = {
              "time": clean(
                  val(
                      solar_speed,
                      "time_tag",
                      "time"
                  )
              ),

              "speed": number(
                  val(
                      solar_speed,
                      "proton_speed",
                      "speed"
                  )
              )
          }

          magnetic_field = {
              "time": clean(
                  val(
                      magnetic,
                      "time_tag",
                      "time"
                  )
              ),

              "bt": number(
                  val(
                      magnetic,
                      "bt",
                      "Bt"
                  )
              ),

              "bz": number(
                  val(
                      magnetic,
                      "bz_gsm",
                      "bz",
                      "Bz"
                  )
              )
          }

          kp_data = {
              "time": clean(
                  val(
                      kp,
                      "time_tag",
                      "time"
                  )
              ),

              "kp": number(
                  val(
                      kp,
                      "Kp",
                      "kp"
                  )
              )
          }

          flux_data = {
              "time": clean(
                  val(
                      flux,
                      "time_tag",
                      "time"
                  )
              ),

              "flux": number(
                  val(
                      flux,
                      "flux",
                      "f10_7"
                  )
              )
          }

          print("")
          print(
              "SOLAR WIND:",
              solar_wind
          )

          print(
              "MAGNETIC FIELD:",
              magnetic_field
          )

          print(
              "KP:",
              kp_data
          )

          print(
              "10CM FLUX:",
              flux_data
          )

          # ============================================================
          # SATELLITE IMAGES
          # ============================================================

          os.makedirs(
              "world-media",
              exist_ok=True
          )

          image_sources = {
              "earth":
                  "https://cdn.star.nesdis.noaa.gov/"
                  "GOES19/ABI/CONUS/"
                  "GEOCOLOR/1250x750.jpg",

              "media1":
                  "https://cdn.star.nesdis.noaa.gov/"
                  "GOES19/GLM/CONUS/"
                  "EXTENT3/1250x750.jpg",

              "media2":
                  "https://cdn.star.nesdis.noaa.gov/"
                  "GOES19/ABI/CONUS/"
                  "DMW/1250x750.jpg"
          }

          for key, url in image_sources.items():

              path = (
                  f"world-media/{key}.jpg"
              )

              print(
                  "Downloading:",
                  key
              )

              download(
                  url,
                  path
              )

              print(
                  "Downloaded:",
                  os.path.getsize(path),
                  "bytes"
              )

          # ============================================================
          # WORLD DATA
          # ============================================================

          world = {
              "generatedAt":
                  generated,

              "sources": {
                  "weather":
                      "AviationWeather.gov",

                  "spaceWeather":
                      "NOAA SWPC",

                  "satellite":
                      "NOAA GOES"
              },

              "images": {
                  "earth":
                      "world-media/earth.jpg",

                  "media1":
                      "world-media/media1.jpg",

                  "media2":
                      "world-media/media2.jpg"
              },

              "atmosphere":
                  atmosphere_data,

              "randomPlace":
                  random_place_data,

              "space": {
                  "solarWind":
                      solar_wind,

                  "magneticField":
                      magnetic_field,

                  "interplanetary": {
                      "solarWind":
                          solar_wind,

                      "magneticField":
                          magnetic_field
                  },

                  "kp":
                      kp_data,

                  "flux10cm":
                      flux_data
              }
          }

          with open(
              "world-data.json",
              "w",
              encoding="utf-8"
          ) as f:

              json.dump(
                  world,
                  f,
                  ensure_ascii=False,
                  indent=2
              )

          print("")
          print("================================")
          print("WORLD DATA CREATED")
          print("================================")

          print(
              "Random Place:",
              random_place_data["name"]
          )

          print(
              "Coordinates:",
              random_place_data["lat"],
              random_place_data["lon"]
          )

          print(
              "Solar Wind:",
              solar_wind["speed"]
          )

          print(
              "Magnetic Bt:",
              magnetic_field["bt"]
          )

          print(
              "Magnetic Bz:",
              magnetic_field["bz"]
          )

          print(
              "Kp:",
              kp_data["kp"]
          )

          print(
              "10cm Flux:",
              flux_data["flux"]
          )

          print("================================")

          PY

      - name: Verify world-data.json
        run: |
          python - <<'PY'
          import json

          with open(
              "world-data.json",
              "r",
              encoding="utf-8"
          ) as f:
              data = json.load(f)

          atmosphere = data.get(
              "atmosphere"
          )

          random_place = data.get(
              "randomPlace"
          )

          space = data.get(
              "space"
          )

          if not isinstance(
              atmosphere,
              dict
          ) or not atmosphere:
              raise RuntimeError(
                  "Atmosphere data is empty."
              )

          if not isinstance(
              random_place,
              dict
          ) or not random_place:
              raise RuntimeError(
                  "Random Place data is empty."
              )

          if (
              random_place.get("lat") is None
              or
              random_place.get("lon") is None
          ):
              raise RuntimeError(
                  "Random Place coordinates are missing."
              )

          if not isinstance(
              space,
              dict
          ) or not space:
              raise RuntimeError(
                  "Space Weather data is empty."
              )

          print(
              "================================"
          )

          print(
              "Verification OK"
          )

          print(
              "Atmosphere:",
              atmosphere.get("name")
          )

          print(
              "Random Place:",
              random_place.get("name")
          )

          print(
              "Coordinates:",
              random_place.get("lat"),
              random_place.get("lon")
          )

          print(
              "Solar Wind:",
              space.get(
                  "solarWind",
                  {}
              ).get("speed")
          )

          print(
              "Magnetic Bt:",
              space.get(
                  "magneticField",
                  {}
              ).get("bt")
          )

          print(
              "Kp:",
              space.get(
                  "kp",
                  {}
              ).get("kp")
          )

          print(
              "10cm Flux:",
              space.get(
                  "flux10cm",
                  {}
              ).get("flux")
          )

          print(
              "================================"
          )

          PY

      - name: Commit updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add world-data.json world-media/

          if git diff --cached --quiet; then
            echo "No changes."
          else
            git commit -m "Update WORLD NEWS data"
            git push
          fi
