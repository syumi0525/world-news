          )

          print(
              "WORLD POPULATION:",
              global_pulse["population"]["display"]
          )

          print(
              "CO2:",
              global_pulse["co2"]["display"]
          )

          print(
              "SEA SURFACE:",
              global_pulse["seaSurface"]["display"]
          )

          print(
              "GEOMAGNETIC:",
              global_pulse["geomagnetic"]["display"]
          )

          print(
              "DAY / NIGHT:",
              global_pulse["dayNight"]["display"]
          )

          print(
              "CLOUD COVER:",
