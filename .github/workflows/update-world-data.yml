name: Update WORLD NEWS data

on:
  workflow_dispatch:
  schedule:
    - cron: "*/10 * * * *"

permissions:
  contents: write

jobs:
  update-world-data:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Update WORLD NEWS data
        shell: bash
        run: |
          python - <<'PY'
          import json
          import os
          import random
          import time
          import urllib.request
          from datetime import datetime, timezone

          UA = "WORLD-NEWS/1.0"

          def get_json(url):
              req = urllib.request.Request(
                  url,
                  headers={
                      "User-Agent": UA,
                      "Accept": "application/json"
                  }
              )
              with urllib.request.urlopen(req, timeout=30) as r:
                  return json.loads(r.read().decode("utf-8"))

          def download(url, path):
              req = urllib.request.Request(url, headers={"User-Agent": UA})
              with urllib.request.urlopen(req, timeout=45) as r:
                  data = r.read()
              if len(data) < 1000:
                  raise RuntimeError("Image download too small")
              with open(path, "wb") as f:
                  f.write(data)

          def clean(value, fallback=""):
              if value is None:
                  return fallback
              return str(value).strip()

          def num(value):
              try:
                  return float(value)
              except:
                  return None

          def latest(items):
              if not isinstance(items, list):
                  return None
              for item in reversed(items):
                  if isinstance(item, dict):
                      return item
              return None

          generated = datetime.now(timezone.utc).isoformat()

          # ------------------------------------------------------------
          # 1. WORLD WEATHER / RANDOM PLACE
          # ------------------------------------------------------------

          metar_url = (
              "https://aviationweather.gov/api/data/metar"
              "?format=json&hours=2"
          )

          metars = get_json(metar_url)

          usable = []

          for m in metars if isinstance(metars, list) else []:
              if not isinstance(m, dict):
                  continue

              lat = num(m.get("lat"))
              lon = num(m.get("lon"))
              temp = num(m.get("temp"))

              if lat is None or lon is None:
                  continue

              if not clean(m.get("icaoId")):
                  continue

              # 温度など一部欠損していても場所としては利用する
              usable.append(m)

          if len(usable) < 2:
              raise RuntimeError(
                  "Not enough current worldwide METAR stations returned."
              )

          random.shuffle(usable)

          place1 = usable[0]
          place2 = usable[1]

          def make_place(m):
              return {
                  "name": clean(
                      m.get("name"),
                      clean(m.get("icaoId"), "Unknown station")
                  ),
                  "station": clean(m.get("icaoId")),
                  "lat": num(m.get("lat")),
                  "lon": num(m.get("lon")),
                  "weather": clean(m.get("wxString"), "Clear / no coded weather"),
                  "temperature": num(m.get("temp")),
                  "dewpoint": num(m.get("dewp")),
                  "windSpeed": num(m.get("wspd")),
                  "windDirection": num(m.get("wdir")),
                  "visibility": clean(m.get("visib"), "N/A"),
                  "flightCategory": clean(m.get("fltCat")),
                  "observationTime": clean(m.get("obsTime")),
                  "raw": clean(m.get("rawOb"))
              }

          random_place = make_place(place1)
          atmosphere_place = make_place(place2)

          # ------------------------------------------------------------
          # 2. NOAA SPACE WEATHER
          # ------------------------------------------------------------

          def safe_json(url):
              try:
                  return get_json(url)
              except Exception as e:
                  print("Space-weather fetch failed:", url, e)
                  return []

          solar_speed = safe_json(
              "https://services.swpc.noaa.gov/products/solar-wind/solar-wind-speed.json"
          )

          magnetic_field = safe_json(
              "https://services.swpc.noaa.gov/products/solar-wind/solar-wind-mag-field.json"
          )

          kp_data = safe_json(
              "https://services.swpc.noaa.gov/products/noaa-planetary-k-index.json"
          )

          flux_data = safe_json(
              "https://services.swpc.noaa.gov/json/f107_cm_flux.json"
          )

          speed_latest = latest(solar_speed)
          magnetic_latest = latest(magnetic_field)
          kp_latest = latest(kp_data)
          flux_latest = latest(flux_data)

          # ------------------------------------------------------------
          # 3. NOAA SCALE DATA
          # ------------------------------------------------------------

          scales = safe_json(
              "https://services.swpc.noaa.gov/products/noaa-scales.json"
          )

          # NOAA's scale endpoint is an object, not an array.
          if not isinstance(scales, dict):
              scales = {}

          # ------------------------------------------------------------
          # 4. CURRENT NOAA SATELLITE IMAGES
          #
          # Each image is intentionally different:
          # Earth       = GOES-19 CONUS GeoColor
          # Media 01    = GOES-19 lightning + GeoColor
          # Media 02    = GOES-19 CONUS DMW
          #
          # NOAA updates these imagery products every few minutes.
          # ------------------------------------------------------------

          os.makedirs("world-media", exist_ok=True)

          image_sources = {
              "earth": (
                  "https://cdn.star.nesdis.noaa.gov/"
                  "GOES19/ABI/CONUS/GEOCOLOR/1250x750.jpg"
              ),
              "media1": (
                  "https://cdn.star.nesdis.noaa.gov/"
                  "GOES19/GLM/CONUS/EXTENT3/1250x750.jpg"
              ),
              "media2": (
                  "https://cdn.star.nesdis.noaa.gov/"
                  "GOES19/ABI/CONUS/DMW/1250x750.jpg"
              )
          }

          # Download independently.
          # If one NOAA image endpoint is temporarily unavailable,
          # keep the last successfully downloaded image instead of
          # destroying the existing image.
          for key, url in image_sources.items():
              path = f"world-media/{key}.jpg"
              try:
                  print("Downloading", key, url)
                  download(url, path)
                  print("OK:", key, os.path.getsize(path))
              except Exception as e:
                  print("Image update failed:", key, e)
                  if not os.path.exists(path):
                      raise

          # ------------------------------------------------------------
          # 5. WORLD DATA JSON
          # ------------------------------------------------------------

          data = {
              "generatedAt": generated,

              "sources": {
                  "weather": "AviationWeather.gov METAR",
                  "spaceWeather": "NOAA Space Weather Prediction Center",
                  "satellite": "NOAA GOES"
              },

              "images": {
                  "earth": "world-media/earth.jpg",
                  "media1": "world-media/media1.jpg",
                  "media2": "world-media/media2.jpg"
              },

              "atmosphere": atmosphere_place,

              "randomPlace": random_place,

              "space": {
                  "solarWind": speed_latest or {},
                  "magneticField": magnetic_latest or {},
                  "kp": kp_latest or {},
                  "flux10cm": flux_latest or {},
                  "scales": scales
              }
          }

          with open("world-data.json", "w", encoding="utf-8") as f:
              json.dump(data, f, ensure_ascii=False, indent=2)

          print("WORLD NEWS data generated:", generated)
          print("Atmosphere:", atmosphere_place.get("name"))
          print("Random place:", random_place.get("name"))
          print("Kp:", (kp_latest or {}).get("Kp"))
          print("Images:", image_sources)

          PY

      - name: Commit updated WORLD NEWS data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add world-data.json world-media/

          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi

          git commit -m "Update WORLD NEWS data"
          git push
