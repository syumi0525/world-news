name: Update WORLD NEWS data

on:
  workflow_dispatch:
  schedule:
    - cron: "*/10 * * * *"

permissions:
  contents: write

jobs:
  update-world-data:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Update data and images
        run: |
          python - <<'PY'
          import json
          import random
          import urllib.request
          from datetime import datetime, timezone
          from pathlib import Path

          ROOT = Path(".")
          MEDIA = ROOT / "world-media"
          MEDIA.mkdir(exist_ok=True)

          def get_json(url):
              req = urllib.request.Request(
                  url,
                  headers={"User-Agent": "WORLD-NEWS/1.0"}
              )
              with urllib.request.urlopen(req, timeout=30) as r:
                  return json.load(r)

          def download(url, path):
              req = urllib.request.Request(
                  url,
                  headers={"User-Agent": "WORLD-NEWS/1.0"}
              )
              with urllib.request.urlopen(req, timeout=30) as r:
                  path.write_bytes(r.read())

          # --------------------------------
          # ATMOSPHERE / RANDOM PLACE
          # --------------------------------

          metar_url = (
              "https://aviationweather.gov/api/data/metar"
              "?format=json&hours=1"
          )

          try:
              metars = get_json(metar_url)
          except Exception:
              metars = []

          stations = []

          for m in metars:
              try:
                  if not m.get("icaoId"):
                      continue
                  if m.get("lat") is None or m.get("lon") is None:
                      continue

                  stations.append({
                      "station": m.get("icaoId"),
                      "name": m.get("name") or m.get("icaoId"),
                      "lat": m.get("lat"),
                      "lon": m.get("lon"),
                      "temperature": m.get("temp"),
                      "dewpoint": m.get("dewp"),
                      "windSpeed": m.get("wspd"),
                      "windDirection": m.get("wdir"),
                      "visibility": m.get("visib"),
                      "pressure": m.get("altim"),
                      "weather": m.get("wxString"),
                      "observationTime": m.get("reportTime")
                  })
              except Exception:
                  pass

          random.shuffle(stations)

          atmosphere = stations[0] if len(stations) >= 1 else None
          random_place = stations[1] if len(stations) >= 2 else None

          # --------------------------------
          # SPACE WEATHER
          # --------------------------------

          space = {
              "solarWind": None,
              "magneticField": None,
              "kp": None,
              "flux10cm": None,
              "scales": None,
              "aurora": None
          }

          try:
              data = get_json(
                  "https://services.swpc.noaa.gov/"
                  "products/solar-wind/solar-wind-speed.json"
              )
              if data:
                  latest = data[-1]
                  space["solarWind"] = latest
          except Exception:
              pass

          try:
              data = get_json(
                  "https://services.swpc.noaa.gov/"
                  "products/solar-wind/solar-wind-mag-field.json"
              )
              if data:
                  latest = data[-1]
                  space["magneticField"] = latest
          except Exception:
              pass

          try:
              data = get_json(
                  "https://services.swpc.noaa.gov/"
                  "products/noaa-planetary-k-index.json"
              )
              if data:
                  latest = data[-1]
                  space["kp"] = latest
          except Exception:
              pass

          try:
              data = get_json(
                  "https://services.swpc.noaa.gov/"
                  "products/10cm-flux-30-day.json"
              )
              if data:
                  latest = data[-1]
                  space["flux10cm"] = latest
          except Exception:
              pass

          try:
              data = get_json(
                  "https://services.swpc.noaa.gov/"
                  "products/noaa-scales.json"
              )
              space["scales"] = data
          except Exception:
              pass

          try:
              data = get_json(
                  "https://services.swpc.noaa.gov/"
                  "json/ovation_aurora_latest.json"
              )
              space["aurora"] = data
          except Exception:
              pass

          # --------------------------------
          # GOES IMAGES
          # --------------------------------

          images = {
              "earth": "world-media/earth.jpg",
              "media1": "world-media/media1.jpg",
              "media2": "world-media/media2.jpg"
          }

          try:
              download(
                  "https://cdn.star.nesdis.noaa.gov/"
                  "GOES19/ABI/CONUS/GEOCOLOR/1250x750.jpg",
                  MEDIA / "earth.jpg"
              )
          except Exception as e:
              print("earth image:", e)

          try:
              download(
                  "https://cdn.star.nesdis.noaa.gov/"
                  "GOES19/ABI/CONUS/GEOCOLOR/1250x750.jpg",
                  MEDIA / "media1.jpg"
              )
          except Exception as e:
              print("media1 image:", e)

          try:
              download(
                  "https://cdn.star.nesdis.noaa.gov/"
                  "GOES18/ABI/CONUS/GEOCOLOR/1250x750.jpg",
                  MEDIA / "media2.jpg"
              )
          except Exception as e:
              print("media2 image:", e)

          # --------------------------------
          # SAVE
          # --------------------------------

          output = {
              "generatedAt": datetime.now(
                  timezone.utc
              ).isoformat(),

              "sources": {
                  "atmosphere": "AviationWeather.gov",
                  "spaceWeather": "NOAA Space Weather Prediction Center",
                  "earthObservation": "NOAA GOES"
              },

              "images": images,

              "atmosphere": atmosphere,

              "randomPlace": random_place,

              "space": space
          }

          (ROOT / "world-data.json").write_text(
              json.dumps(
                  output,
                  ensure_ascii=False,
                  indent=2
              ),
              encoding="utf-8"
          )

          print("WORLD NEWS data updated.")
          PY

      - name: Commit updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add world-data.json world-media/

          git diff --cached --quiet || \
            git commit -m "Update WORLD NEWS data"

          git push
