name: Update WORLD NEWS data

on:
  workflow_dispatch:
  schedule:
    - cron: "*/10 * * * *"

permissions:
  contents: write

jobs:
  update-world-data:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Update WORLD NEWS
        run: |
          python - <<'PY'
          import csv
          import gzip
          import io
          import json
          import os
          import random
          import urllib.parse
          import urllib.request
          from datetime import datetime, timezone

          UA = "WORLD-NEWS/1.0"

          def fetch_json(url):
              req = urllib.request.Request(
                  url,
                  headers={
                      "User-Agent": UA,
                      "Accept": "application/json",
                  },
              )

              with urllib.request.urlopen(
                  req,
                  timeout=30
              ) as response:
                  return json.loads(
                      response.read().decode("utf-8")
                  )

          def fetch_bytes(url):
              req = urllib.request.Request(
                  url,
                  headers={
                      "User-Agent": UA
                  },
              )

              with urllib.request.urlopen(
                  req,
                  timeout=60
              ) as response:
                  return response.read()

          def download(url, path):
              data = fetch_bytes(url)

              if len(data) < 1000:
                  raise RuntimeError(
                      "Downloaded image is too small."
                  )

              with open(path, "wb") as f:
                  f.write(data)

          def clean(value, default=""):
              if value is None:
                  return default

              return str(value).strip()

          def number(value):
              try:
                  if value is None:
                      return None

                  text = str(value).strip()

                  if not text:
                      return None

                  return float(text)

              except Exception:
                  return None

          def find_value(row, names):
              for name in names:
                  if name in row:
                      value = row[name]

                      if (
                          value is not None
                          and str(value).strip() != ""
                      ):
                          return value

              return None

          def make_weather(row):
              lat = number(
                  find_value(
                      row,
                      [
                          "latitude",
                          "lat"
                      ]
                  )
              )

              lon = number(
                  find_value(
                      row,
                      [
                          "longitude",
                          "lon"
                      ]
                  )
              )

              station = clean(
                  find_value(
                      row,
                      [
                          "station_id",
                          "icaoId",
                          "station"
                      ]
                  )
              )

              name = clean(
                  find_value(
                      row,
                      [
                          "station_name",
                          "name"
                      ]
                  )
              )

              weather = clean(
                  find_value(
                      row,
                      [
                          "wx_string",
                          "wxString",
                          "weather"
                      ]
                  ),
                  "No coded weather"
              )

              temperature = number(
                  find_value(
                      row,
                      [
                          "temp_c",
                          "temp",
                          "temperature"
                      ]
                  )
              )

              dewpoint = number(
                  find_value(
                      row,
                      [
                          "dewpoint_c",
                          "dewp",
                          "dewpoint"
                      ]
                  )
              )

              wind_speed = number(
                  find_value(
                      row,
                      [
                          "wind_speed_kt",
                          "wspd",
                          "windSpeed"
                      ]
                  )
              )

              wind_direction = number(
                  find_value(
                      row,
                      [
                          "wind_dir_degrees",
                          "wdir",
                          "windDirection"
                      ]
                  )
              )

              visibility = clean(
                  find_value(
                      row,
                      [
                          "visibility_statute_mi",
                          "visib",
                          "visibility"
                      ]
                  ),
                  "N/A"
              )

              flight_category = clean(
                  find_value(
                      row,
                      [
                          "flight_category",
                          "fltCat",
                          "flightCategory"
                      ]
                  ),
                  "N/A"
              )

              observation_time = clean(
                  find_value(
                      row,
                      [
                          "observation_time",
                          "obsTime",
                          "observationTime"
                      ]
                  )
              )

              raw = clean(
                  find_value(
                      row,
                      [
                          "raw_text",
                          "rawOb",
                          "raw"
                      ]
                  )
              )

              return {
                  "name": name or station or "Unknown",
                  "station": station,
                  "lat": lat,
                  "lon": lon,
                  "weather": weather,
                  "temperature": temperature,
                  "dewpoint": dewpoint,
                  "windSpeed": wind_speed,
                  "windDirection": wind_direction,
                  "visibility": visibility,
                  "flightCategory": flight_category,
                  "observationTime": observation_time,
                  "raw": raw
              }

          generated = datetime.now(
              timezone.utc
          ).isoformat()

          # ============================================================
          # METAR
          # ============================================================

          metar_cache_url = (
              "https://aviationweather.gov/"
              "data/cache/metars.cache.csv.gz"
          )

          print("")
          print("================================")
          print("FETCHING METAR CACHE")
          print("================================")
          print(metar_cache_url)

          compressed = fetch_bytes(
              metar_cache_url
          )

          print(
              "Compressed bytes:",
              len(compressed)
          )

          csv_bytes = gzip.decompress(
              compressed
          )

          print(
              "CSV bytes:",
              len(csv_bytes)
          )

          csv_text = csv_bytes.decode(
              "utf-8-sig",
              errors="replace"
          )

          reader = csv.DictReader(
              io.StringIO(csv_text)
          )

          print(
              "CSV columns:",
              reader.fieldnames
          )

          valid_rows = []

          for row in reader:

              if not row:
                  continue

              weather = make_weather(
                  row
              )

              if not weather["station"]:
                  continue

              if weather["lat"] is None:
                  continue

              if weather["lon"] is None:
                  continue

              if (
                  weather["lat"] < -90
                  or
                  weather["lat"] > 90
              ):
                  continue

              if (
                  weather["lon"] < -180
                  or
                  weather["lon"] > 180
              ):
                  continue

              valid_rows.append(
                  weather
              )

          print(
              "Valid METAR stations:",
              len(valid_rows)
          )

          if len(valid_rows) < 2:
              raise RuntimeError(
                  "Not enough valid METAR stations."
              )

          random.shuffle(
              valid_rows
          )

          atmosphere_data = (
              valid_rows[0]
          )

          random_place_data = (
              valid_rows[1]
          )

          print("")
          print(
              "ATMOSPHERE:",
              atmosphere_data
          )

          print(
              "RANDOM PLACE:",
              random_place_data
          )

          if (
              random_place_data["lat"] is None
              or
              random_place_data["lon"] is None
          ):
              raise RuntimeError(
                  "Random Place has no coordinates."
              )

          # ============================================================
          # NOAA SPACE WEATHER
          # ============================================================

          solar_speed_url = (
              "https://services.swpc.noaa.gov/"
              "products/summary/"
              "solar-wind-speed.json"
          )

          magnetic_url = (
              "https://services.swpc.noaa.gov/"
              "products/summary/"
              "solar-wind-mag-field.json"
          )

          kp_url = (
              "https://services.swpc.noaa.gov/"
              "products/"
              "noaa-planetary-k-index.json"
          )

          flux_url = (
              "https://services.swpc.noaa.gov/"
              "products/summary/"
              "10cm-flux.json"
          )

          print("")
          print("================================")
          print("FETCHING NOAA SPACE WEATHER")
          print("================================")

          solar_speed_raw = fetch_json(
              solar_speed_url
          )

          magnetic_raw = fetch_json(
              magnetic_url
          )

          kp_raw = fetch_json(
              kp_url
          )

          flux_raw = fetch_json(
              flux_url
          )

          def latest_row(data):
              if isinstance(data, dict):
                  return data

              if not isinstance(
                  data,
                  list
              ):
                  return {}

              for row in reversed(data):

                  if isinstance(
                      row,
                      dict
                  ):
                      return row

              return {}

          def val(obj, *keys):
              for key in keys:
                  if (
                      isinstance(obj, dict)
                      and
                      key in obj
                  ):
                      return obj[key]

              return None

          solar_speed = latest_row(
              solar_speed_raw
          )

          magnetic = latest_row(
              magnetic_raw
          )

          kp_rows = (
              kp_raw
              if isinstance(
                  kp_raw,
                  list
              )
              else [kp_raw]
          )

          kp_rows = [
              row
              for row in kp_rows
              if isinstance(
                  row,
                  dict
              )
          ]

          kp = (
              kp_rows[-1]
              if kp_rows
              else {}
          )

          flux = latest_row(
              flux_raw
          )

          solar_wind = {
              "time": clean(
                  val(
                      solar_speed,
                      "time_tag",
                      "time"
                  )
              ),

              "speed": number(
                  val(
                      solar_speed,
                      "proton_speed",
                      "speed"
                  )
              )
          }

          magnetic_field = {
              "time": clean(
                  val(
                      magnetic,
                      "time_tag",
                      "time"
                  )
              ),

              "bt": number(
                  val(
                      magnetic,
                      "bt",
                      "Bt"
                  )
              ),

              "bz": number(
                  val(
                      magnetic,
                      "bz_gsm",
                      "bz",
                      "Bz"
                  )
              )
          }

          kp_data = {
              "time": clean(
                  val(
                      kp,
                      "time_tag",
                      "time"
                  )
              ),

              "kp": number(
                  val(
                      kp,
                      "Kp",
                      "kp"
                  )
              )
          }

          flux_data = {
              "time": clean(
                  val(
                      flux,
                      "time_tag",
                      "time"
                  )
              ),

              "flux": number(
                  val(
                      flux,
                      "flux",
                      "f10_7"
                  )
              )
          }

          # ============================================================
          # MEDIA SIGNAL IMAGES
          #
          # ① Wikimedia Commons
          #    最近追加された商用利用可能画像からランダム選択
          #
          # ② NOAA
          #    地球観測 / 太陽観測画像からランダム選択
          # ============================================================

          os.makedirs(
              "world-media",
              exist_ok=True
          )

          # ------------------------------------------------------------
          # MEDIA SIGNAL ①
          # Wikimedia Commons
          # ------------------------------------------------------------

          commons_api = (
              "https://commons.wikimedia.org/"
              "w/api.php"
          )

          recent_params = {
              "action": "query",
              "format": "json",
              "list": "recentchanges",
              "rcnamespace": "6",
              "rctype": "new",
              "rcshow": "!redirect",
              "rcprop": "title|ids|timestamp",
              "rclimit": "100"
          }

          recent_url = (
              commons_api
              + "?"
              + urllib.parse.urlencode(
                  recent_params
              )
          )

          print("")
          print("================================")
          print("FETCHING WIKIMEDIA COMMONS")
          print("================================")

          recent_data = fetch_json(
              recent_url
          )

          recent_changes = (
              recent_data
              .get("query", {})
              .get("recentchanges", [])
          )

          random.shuffle(
              recent_changes
          )

          titles = []

          for change in recent_changes:

              title = clean(
                  change.get("title")
              )

              if not title:
                  continue

              lower_title = title.lower()

              blocked_words = [
                  "portrait",
                  "selfie",
                  "wedding",
                  "funeral",
                  "person",
                  "people",
                  "face",
                  "screenshot",
                  "logo",
                  "poster",
                  "advertisement",
                  "advertising"
              ]

              if any(
                  word in lower_title
                  for word in blocked_words
              ):
                  continue

              titles.append(
                  title
              )

              if len(titles) >= 30:
                  break

          media1_info = None

          if titles:

              image_params = {
                  "action": "query",
                  "format": "json",
                  "titles": "|".join(
                      titles
                  ),
                  "prop": "imageinfo",
                  "iiprop":
                      "url|mime|size|extmetadata",
                  "iiurlwidth": "1250"
              }

              image_url = (
                  commons_api
                  + "?"
                  + urllib.parse.urlencode(
                      image_params
                  )
              )

              image_data = fetch_json(
                  image_url
              )

              pages = (
                  image_data
                  .get("query", {})
                  .get("pages", {})
              )

              candidates = []

              for page in pages.values():

                  imageinfo = (
                      page.get(
                          "imageinfo",
                          []
                      )
                  )

                  if not imageinfo:
                      continue

                  info = imageinfo[0]

                  mime = clean(
                      info.get("mime")
                  )

                  width = info.get(
                      "width",
                      0
                  )

                  height = info.get(
                      "height",
                      0
                  )

                  if mime not in [
                      "image/jpeg",
                      "image/png"
                  ]:
                      continue

                  if (
                      not isinstance(
                          width,
                          int
                      )
                      or
                      not isinstance(
                          height,
                          int
                      )
                  ):
                      continue

                  if width < 800:
                      continue

                  if height < 450:
                      continue

                  metadata = info.get(
                      "extmetadata",
                      {}
                  )

                  license_short = clean(
                      metadata.get(
                          "LicenseShortName",
                          {}
                      ).get("value")
                  )

                  license_lower = (
                      license_short.lower()
                  )

                  allowed_license = (
                      "cc0"
                      in license_lower
                      or
                      "cc by"
                      in license_lower
                      or
                      "cc-by"
                      in license_lower
                      or
                      "public domain"
                      in license_lower
                  )

                  if not allowed_license:
                      continue

                  thumburl = clean(
                      info.get(
                          "thumburl"
                      )
                  )

                  original_url = clean(
                      info.get(
                          "url"
                      )
                  )

                  if not thumburl:
                      thumburl = (
                          original_url
                      )

                  if not thumburl:
                      continue

                  artist = clean(
                      metadata.get(
                          "Artist",
                          {}
                      ).get("value")
                  )

                  page_title = clean(
                      page.get(
                          "title"
                      )
                  )

                  page_url = (
                      "https://commons.wikimedia.org/wiki/"
                      + urllib.parse.quote(
                          page_title.replace(
                              " ",
                              "_"
                          ),
                          safe=":/"
                      )
                  )

                  candidates.append(
                      {
                          "title":
                              page_title,

                          "artist":
                              artist,

                          "license":
                              license_short,

                          "url":
                              page_url,

                          "imageUrl":
                              thumburl
                      }
                  )

              if candidates:
                  media1_info = random.choice(
                      candidates
                  )

          if not media1_info:
              raise RuntimeError(
                  "No suitable commercial-use Wikimedia Commons image found."
              )

          media1_path = (
              "world-media/media1.jpg"
          )

          print("")
          print(
              "MEDIA SIGNAL ①:"
          )

          print(
              "Title:",
              media1_info["title"]
          )

          print(
              "License:",
              media1_info["license"]
          )

          print(
              "Image URL:",
              media1_info["imageUrl"]
          )

          download(
              media1_info["imageUrl"],
              media1_path
          )

          # ------------------------------------------------------------
          # MEDIA SIGNAL ②
          # NOAA satellite / space imagery
          # ------------------------------------------------------------

          noaa_sources = [
              {
                  "name":
                      "NOAA GOES-19 CONUS",
                  "source":
                      "NOAA GOES",
                  "url":
                      "https://cdn.star.nesdis.noaa.gov/"
                      "GOES19/ABI/CONUS/"
                      "GEOCOLOR/1250x750.jpg"
              },

              {
                  "name":
                      "NOAA GOES-18 CONUS",
                  "source":
                      "NOAA GOES",
                  "url":
                      "https://cdn.star.nesdis.noaa.gov/"
                      "GOES18/ABI/CONUS/"
                      "GEOCOLOR/1250x750.jpg"
              },

              {
                  "name":
                      "NOAA GOES-19 SUVI 094",
                  "source":
                      "NOAA SUVI",
                  "url":
                      "https://services.swpc.noaa.gov/"
                      "images/animations/suvi/"
                      "primary/094/latest.png"
              },

              {
                  "name":
                      "NOAA GOES-19 SUVI 131",
                  "source":
                      "NOAA SUVI",
                  "url":
                      "https://services.swpc.noaa.gov/"
                      "images/animations/suvi/"
                      "primary/131/latest.png"
              },

              {
                  "name":
                      "NOAA GOES-19 SUVI 171",
                  "source":
                      "NOAA SUVI",
                  "url":
                      "https://services.swpc.noaa.gov/"
                      "images/animations/suvi/"
                      "primary/171/latest.png"
              },

              {
                  "name":
                      "NOAA GOES-19 SUVI 195",
                  "source":
                      "NOAA SUVI",
                  "url":
                      "https://services.swpc.noaa.gov/"
                      "images/animations/suvi/"
                      "primary/195/latest.png"
              },

              {
                  "name":
                      "NOAA GOES-19 SUVI 284",
                  "source":
                      "NOAA SUVI",
                  "url":
                      "https://services.swpc.noaa.gov/"
                      "images/animations/suvi/"
                      "primary/284/latest.png"
              },

              {
                  "name":
                      "NOAA GOES-19 SUVI 304",
                  "source":
                      "NOAA SUVI",
                  "url":
                      "https://services.swpc.noaa.gov/"
                      "images/animations/suvi/"
                      "primary/304/latest.png"
              }
          ]

          random.shuffle(
              noaa_sources
          )

          media2_info = None

          media2_path = (
              "world-media/media2.jpg"
          )

          for candidate in noaa_sources:

              try:

                  print("")
                  print(
                      "Trying MEDIA SIGNAL ②:"
                  )

                  print(
                      candidate["name"]
                  )

                  temp_path = (
                      "world-media/"
                      "media2_download"
                  )

                  data = fetch_bytes(
                      candidate["url"]
                  )

                  if len(data) < 1000:
                      continue

                  with open(
                      temp_path,
                      "wb"
                  ) as f:
                      f.write(data)

                  os.replace(
                      temp_path,
                      media2_path
                  )

                  media2_info = candidate

                  break

              except Exception as e:

                  print(
                      "Failed:",
                      candidate["name"],
                      str(e)
                  )

          if not media2_info:
              raise RuntimeError(
                  "No NOAA MEDIA SIGNAL ② image could be downloaded."
              )

          print("")
          print(
              "MEDIA SIGNAL ②:"
          )

          print(
              "Source:",
              media2_info["name"]
          )

          print(
              "URL:",
              media2_info["url"]
          )

          # ============================================================
          # WORLD DATA
          # ============================================================

          world = {
              "generatedAt":
                  generated,

              "sources": {
                  "weather":
                      "AviationWeather.gov",

                  "spaceWeather":
                      "NOAA SWPC",

                  "mediaSignal1":
                      "Wikimedia Commons",

                  "mediaSignal2":
                      media2_info["source"]
              },

              "images": {
                  "earth":
                      "world-media/earth.jpg",

                  "media1":
                      "world-media/media1.jpg",

                  "media2":
                      "world-media/media2.jpg"
              },

              "mediaSignal1": {
                  "source":
                      "Wikimedia Commons",

                  "title":
                      media1_info["title"],

                  "artist":
                      media1_info["artist"],

                  "license":
                      media1_info["license"],

                  "page":
                      media1_info["url"]
              },

              "mediaSignal2": {
                  "source":
                      media2_info["source"],

                  "name":
                      media2_info["name"],

                  "url":
                      media2_info["url"]
              },

              "atmosphere":
                  atmosphere_data,

              "randomPlace":
                  random_place_data,

              "space": {
                  "solarWind":
                      solar_wind,

                  "magneticField":
                      magnetic_field,

                  "interplanetary": {
                      "solarWind":
                          solar_wind,

                      "magneticField":
                          magnetic_field
                  },

                  "kp":
                      kp_data,

                  "flux10cm":
                      flux_data
              }
          }

          with open(
              "world-data.json",
              "w",
              encoding="utf-8"
          ) as f:

              json.dump(
                  world,
                  f,
                  ensure_ascii=False,
                  indent=2
              )

          print("")
          print("================================")
          print("WORLD DATA CREATED")
          print("================================")

          print(
              "Random Place:",
              random_place_data["name"]
          )

          print(
              "Coordinates:",
              random_place_data["lat"],
              random_place_data["lon"]
          )

          print(
              "MEDIA SIGNAL ①:",
              media1_info["title"]
          )

          print(
              "MEDIA SIGNAL ① license:",
              media1_info["license"]
          )

          print(
              "MEDIA SIGNAL ②:",
              media2_info["name"]
          )

          print(
              "Solar Wind:",
              solar_wind["speed"]
          )

          print(
              "Magnetic Bt:",
              magnetic_field["bt"]
          )

          print(
              "Magnetic Bz:",
              magnetic_field["bz"]
          )

          print(
              "Kp:",
              kp_data["kp"]
          )

          print(
              "10cm Flux:",
              flux_data["flux"]
          )

          print("================================")

          PY

      - name: Verify world-data.json
        run: |
          python - <<'PY'
          import json
          import os

          with open(
              "world-data.json",
              "r",
              encoding="utf-8"
          ) as f:
              data = json.load(f)

          atmosphere = data.get(
              "atmosphere"
          )

          random_place = data.get(
              "randomPlace"
          )

          space = data.get(
              "space"
          )

          images = data.get(
              "images"
          )

          media1 = data.get(
              "mediaSignal1"
          )

          media2 = data.get(
              "mediaSignal2"
          )

          if not isinstance(
              atmosphere,
              dict
          ) or not atmosphere:
              raise RuntimeError(
                  "Atmosphere data is empty."
              )

          if not isinstance(
              random_place,
              dict
          ) or not random_place:
              raise RuntimeError(
                  "Random Place data is empty."
              )

          if (
              random_place.get("lat") is None
              or
              random_place.get("lon") is None
          ):
              raise RuntimeError(
                  "Random Place coordinates are missing."
              )

          if not isinstance(
              space,
              dict
          ) or not space:
              raise RuntimeError(
                  "Space Weather data is empty."
              )

          if not isinstance(
              images,
              dict
          ):
              raise RuntimeError(
                  "Images data is missing."
              )

          if not images.get(
              "media1"
          ):
              raise RuntimeError(
                  "MEDIA SIGNAL ① is missing."
              )

          if not images.get(
              "media2"
          ):
              raise RuntimeError(
                  "MEDIA SIGNAL ② is missing."
              )

          if not os.path.exists(
              "world-media/media1.jpg"
          ):
              raise RuntimeError(
                  "MEDIA SIGNAL ① image file is missing."
              )

          if not os.path.exists(
              "world-media/media2.jpg"
          ):
              raise RuntimeError(
                  "MEDIA SIGNAL ② image file is missing."
              )

          if not isinstance(
              media1,
              dict
          ) or not media1.get(
              "license"
          ):
              raise RuntimeError(
                  "MEDIA SIGNAL ① license metadata is missing."
              )

          if not isinstance(
              media2,
              dict
          ) or not media2.get(
              "source"
          ):
