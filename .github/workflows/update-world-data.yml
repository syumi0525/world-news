name: Update WORLD NEWS data

on:
  workflow_dispatch:
  schedule:
    - cron: "*/10 * * * *"

permissions:
  contents: write

jobs:
  update-world-data:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Generate WORLD NEWS data
        run: |
          python - <<'PY'
          import json, gzip, csv, io, os, random, urllib.request
          from datetime import datetime, timezone

          UA = "WORLD-NEWS/1.0"

          def get(url):
              req = urllib.request.Request(url, headers={"User-Agent": UA})
              with urllib.request.urlopen(req, timeout=60) as r:
                  return r.read()

          def get_json(url):
              return json.loads(get(url).decode("utf-8"))

          def num(x):
              try:
                  return float(x)
              except:
                  return None

          # =========================
          # ATMOSPHERE / RANDOM PLACE
          # =========================

          raw = get(
              "https://aviationweather.gov/data/cache/metars.cache.csv.gz"
          )

          text = gzip.decompress(raw).decode("utf-8", errors="replace")

          rows = list(csv.DictReader(io.StringIO(text)))

          usable = []

          for r in rows:
              lat = num(r.get("lat"))
              lon = num(r.get("lon"))

              if r.get("icaoId") and lat is not None and lon is not None:
                  usable.append(r)

          if len(usable) < 2:
              raise RuntimeError("METAR data unavailable")

          random.shuffle(usable)

          def weather(r):
              return {
                  "name": r.get("name") or r.get("icaoId"),
                  "station": r.get("icaoId"),
                  "lat": num(r.get("lat")),
                  "lon": num(r.get("lon")),
                  "weather": r.get("wxString") or "No coded weather",
                  "temperature": num(r.get("temp")),
                  "dewpoint": num(r.get("dewp")),
                  "windSpeed": num(r.get("wspd")),
                  "windDirection": num(r.get("wdir")),
                  "visibility": r.get("visib") or "N/A",
                  "flightCategory": r.get("fltCat") or "N/A",
                  "observationTime": r.get("obsTime") or "",
                  "raw": r.get("rawOb") or ""
              }

          atmosphere = weather(usable[0])
          random_place = weather(usable[1])

          # =========================
          # NOAA SPACE WEATHER
          # =========================

          speed = get_json(
              "https://services.swpc.noaa.gov/products/solar-wind/solar-wind-speed.json"
          )

          mag = get_json(
              "https://services.swpc.noaa.gov/products/solar-wind/solar-wind-mag-field.json"
          )

          kp = get_json(
              "https://services.swpc.noaa.gov/products/noaa-planetary-k-index.json"
          )

          flux = get_json(
              "https://services.swpc.noaa.gov/products/10cm-flux-30-day.json"
          )

          def last(data):
              if isinstance(data, list):
                  for x in reversed(data):
                      if isinstance(x, dict):
                          return x
              return {}

          s = last(speed)
          m = last(mag)
          k = last(kp)
          f = last(flux)

          solar_wind = {
              "time": s.get("time_tag", ""),
              "speed": num(s.get("proton_speed"))
          }

          magnetic = {
              "time": m.get("time_tag", ""),
              "bt": num(m.get("bt")),
              "bz": num(m.get("bz_gsm"))
          }

          kp_data = {
              "time": k.get("time_tag", ""),
              "kp": num(k.get("Kp"))
          }

          flux_data = {
              "time": f.get("time_tag", ""),
              "flux": num(f.get("flux"))
          }

          # =========================
          # SAVE
          # =========================

          os.makedirs("world-media", exist_ok=True)

          images = {
              "earth":
                "https://cdn.star.nesdis.noaa.gov/GOES19/ABI/CONUS/GEOCOLOR/1250x750.jpg",

              "media1":
                "https://cdn.star.nesdis.noaa.gov/GOES19/GLM/CONUS/EXTENT3/1250x750.jpg",

              "media2":
                "https://cdn.star.nesdis.noaa.gov/GOES19/ABI/CONUS/DMW/1250x750.jpg"
          }

          for name, url in images.items():
              try:
                  data = get(url)
                  if len(data) > 1000:
                      with open(f"world-media/{name}.jpg", "wb") as f:
                          f.write(data)
              except Exception as e:
                  print("IMAGE ERROR", name, e)

          output = {
              "generatedAt": datetime.now(timezone.utc).isoformat(),

              "images": {
                  "earth": "world-media/earth.jpg",
                  "media1": "world-media/media1.jpg",
                  "media2": "world-media/media2.jpg"
              },

              "atmosphere": atmosphere,

              "randomPlace": random_place,

              "space": {
                  "solarWind": solar_wind,
                  "magneticField": magnetic,

                  "interplanetary": {
                      "solarWindSpeed": solar_wind["speed"],
                      "bt": magnetic["bt"],
                      "bz": magnetic["bz"]
                  },

                  "kp": kp_data,
                  "flux10cm": flux_data
              }
          }

          with open("world-data.json", "w", encoding="utf-8") as f:
              json.dump(output, f, ensure_ascii=False, indent=2)

          print("ATMOSPHERE:", atmosphere["name"])
          print("RANDOM:", random_place["name"])
          print("SOLAR WIND:", solar_wind)
          print("MAGNETIC:", magnetic)
          print("KP:", kp_data)
          print("FLUX:", flux_data)

          PY

      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add world-data.json world-media/
          git diff --cached --quiet || git commit -m "Update WORLD NEWS"
          git push
