name: Update WORLD NEWS data

on:
  workflow_dispatch:
  schedule:
    - cron: "*/10 * * * *"

permissions:
  contents: write

jobs:
  update-world-data:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Update WORLD NEWS
        run: |
          python - <<'PY'
          import json
          import os
          import random
          import urllib.request
          from datetime import datetime, timezone

          UA = "WORLD-NEWS/1.0"

          def get(url):
              req = urllib.request.Request(
                  url,
                  headers={"User-Agent": UA, "Accept": "application/json"}
              )
              with urllib.request.urlopen(req, timeout=60) as r:
                  return r.read()

          def get_json(url):
              return json.loads(get(url).decode("utf-8"))

          def num(v):
              try:
                  return float(v)
              except:
                  return None

          # ==========================================
          # WEATHER
          # ==========================================

          weather = []

          try:
              data = get_json(
                  "https://aviationweather.gov/api/data/metar"
                  "?format=json&hours=1"
              )

              if isinstance(data, list):
                  weather = [
                      x for x in data
                      if isinstance(x, dict)
                      and x.get("icaoId")
                      and num(x.get("lat")) is not None
                      and num(x.get("lon")) is not None
                  ]

          except Exception as e:
              print("WEATHER ERROR:", e)

          def make_weather(x):
              return {
                  "name": x.get("name") or x.get("icaoId") or "Unknown",
                  "station": x.get("icaoId") or "",
                  "lat": num(x.get("lat")),
                  "lon": num(x.get("lon")),
                  "weather": x.get("wxString") or "No coded weather",
                  "temperature": num(x.get("temp")),
                  "dewpoint": num(x.get("dewp")),
                  "windSpeed": num(x.get("wspd")),
                  "windDirection": num(x.get("wdir")),
                  "visibility": x.get("visib") or "N/A",
                  "flightCategory": x.get("fltCat") or "N/A",
                  "observationTime": x.get("obsTime") or "",
                  "raw": x.get("rawOb") or ""
              }

          if len(weather) >= 2:
              random.shuffle(weather)
              atmosphere = make_weather(weather[0])
              random_place = make_weather(weather[1])
          elif len(weather) == 1:
              atmosphere = make_weather(weather[0])
              random_place = make_weather(weather[0])
          else:
              atmosphere = {}
              random_place = {}

          # ==========================================
          # NOAA SPACE WEATHER
          # ==========================================

          def latest(url):
              try:
                  data = get_json(url)

                  if isinstance(data, list):
                      for row in reversed(data):
                          if isinstance(row, dict):
                              return row

                  return {}
              except Exception as e:
                  print("NOAA ERROR:", url, e)
                  return {}

          solar = latest(
              "https://services.swpc.noaa.gov/"
              "products/solar-wind/solar-wind-speed.json"
          )

          magnetic = latest(
              "https://services.swpc.noaa.gov/"
              "products/solar-wind/solar-wind-mag-field.json"
          )

          kp = latest(
              "https://services.swpc.noaa.gov/"
              "products/noaa-planetary-k-index.json"
          )

          flux = latest(
              "https://services.swpc.noaa.gov/"
              "products/10cm-flux-30-day.json"
          )

          # Aurora
          try:
              aurora = get_json(
                  "https://services.swpc.noaa.gov/"
                  "json/ovation_aurora_latest.json"
              )
              aurora_available = bool(aurora)
          except:
              aurora_available = False

          solar_wind = {
              "time": solar.get("time_tag", ""),
              "speed": num(solar.get("proton_speed"))
          }

          magnetic_field = {
              "time": magnetic.get("time_tag", ""),
              "bt": num(magnetic.get("bt")),
              "bz": num(magnetic.get("bz_gsm"))
          }

          kp_data = {
              "time": kp.get("time_tag", ""),
              "kp": num(kp.get("Kp"))
          }

          flux_data = {
              "time": flux.get("time_tag", ""),
              "flux": num(flux.get("flux"))
          }

          # ==========================================
          # IMAGES
          # ==========================================

          os.makedirs("world-media", exist_ok=True)

          images = {
              "earth":
              "https://cdn.star.nesdis.noaa.gov/"
              "GOES19/ABI/CONUS/GEOCOLOR/1250x750.jpg",

              "media1":
              "https://cdn.star.nesdis.noaa.gov/"
              "GOES19/GLM/CONUS/EXTENT3/1250x750.jpg",

              "media2":
              "https://cdn.star.nesdis.noaa.gov/"
              "GOES19/ABI/CONUS/DMW/1250x750.jpg"
          }

          for name, url in images.items():
              try:
                  data = get(url)

                  if len(data) > 1000:
                      with open(
                          f"world-media/{name}.jpg",
                          "wb"
                      ) as f:
                          f.write(data)

                      print("IMAGE OK:", name)

              except Exception as e:
                  print("IMAGE ERROR:", name, e)

          # ==========================================
          # WORLD DATA
          # ==========================================

          output = {
              "generatedAt":
                  datetime.now(timezone.utc).isoformat(),

              "images": {
                  "earth": "world-media/earth.jpg",
                  "media1": "world-media/media1.jpg",
                  "media2": "world-media/media2.jpg"
              },

              "atmosphere": atmosphere,

              "randomPlace": random_place,

              "space": {
                  "solarWind": solar_wind,

                  "magneticField": magnetic_field,

                  "interplanetary": {
                      "solarWindSpeed":
                          solar_wind["speed"],
                      "bt":
                          magnetic_field["bt"],
                      "bz":
                          magnetic_field["bz"]
                  },

                  "aurora": {
                      "available":
                          aurora_available
                  },

                  "kp": kp_data,

                  "flux10cm": flux_data
              }
          }

          with open(
              "world-data.json",
              "w",
              encoding="utf-8"
          ) as f:
              json.dump(
                  output,
                  f,
                  ensure_ascii=False,
                  indent=2
              )

          print("================================")
          print("WORLD NEWS UPDATE COMPLETE")
          print("ATMOSPHERE:", atmosphere.get("name"))
          print("RANDOM:", random_place.get("name"))
          print("SOLAR WIND:", solar_wind)
          print("MAGNETIC:", magnetic_field)
          print("INTERPLANETARY:", output["space"]["interplanetary"])
          print("KP:", kp_data)
          print("FLUX:", flux_data)
          print("AURORA:", aurora_available)
          print("================================")

          PY

      - name: Commit updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add world-data.json world-media/

          if git diff --cached --quiet; then
            echo "No changes."
          else
            git commit -m "Update WORLD NEWS data"
            git push
          fi
