name: Update WORLD NEWS data

on:
  workflow_dispatch:
  schedule:
    - cron: "*/10 * * * *"

permissions:
  contents: write

jobs:
  update-world-data:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Update WORLD NEWS
        run: |
          python - <<'PY'
          import csv
          import gzip
          import io
          import json
          import math
          import os
          import random
          import urllib.parse
          import urllib.request
          from datetime import datetime, timezone


          UA = "WORLD-NEWS/1.0"


          # ============================================================
          # COMMON FUNCTIONS
          # ============================================================

          def fetch_json(url, timeout=60):
              req = urllib.request.Request(
                  url,
                  headers={
                      "User-Agent": UA,
                      "Accept": "application/json",
                  },
              )

              with urllib.request.urlopen(
                  req,
                  timeout=timeout
              ) as response:
                  return json.loads(
                      response.read().decode("utf-8")
                  )


          def fetch_bytes(url, timeout=60):
              req = urllib.request.Request(
                  url,
                  headers={
                      "User-Agent": UA
                  },
              )

              with urllib.request.urlopen(
                  req,
                  timeout=timeout
              ) as response:
                  return response.read()


          def download(url, path):
              data = fetch_bytes(url)

              if len(data) < 1000:
                  raise RuntimeError(
                      "Downloaded image is too small."
                  )

              with open(path, "wb") as f:
                  f.write(data)


          def clean(value, default=""):
              if value is None:
                  return default

              return str(value).strip()


          def number(value):
              try:
                  if value is None:
                      return None

                  text = str(value).strip()

                  if not text:
                      return None

                  return float(text)

              except Exception:
                  return None


          def find_value(row, names):
              for name in names:
                  if name in row:
                      value = row[name]

                      if (
                          value is not None
                          and str(value).strip() != ""
                      ):
                          return value

              return None


          # ============================================================
          # METAR
          # ============================================================

          def make_weather(row):
              lat = number(
                  find_value(
                      row,
                      [
                          "latitude",
                          "lat"
                      ]
                  )
              )

              lon = number(
                  find_value(
                      row,
                      [
                          "longitude",
                          "lon"
                      ]
                  )
              )

              station = clean(
                  find_value(
                      row,
                      [
                          "station_id",
                          "icaoId",
                          "station"
                      ]
                  )
              )

              name = clean(
                  find_value(
                      row,
                      [
                          "station_name",
                          "name"
                      ]
                  )
              )

              weather = clean(
                  find_value(
                      row,
                      [
                          "wx_string",
                          "wxString",
                          "weather"
                      ]
                  ),
                  "No coded weather"
              )

              temperature = number(
                  find_value(
                      row,
                      [
                          "temp_c",
                          "temp",
                          "temperature"
                      ]
                  )
              )

              dewpoint = number(
                  find_value(
                      row,
                      [
                          "dewpoint_c",
                          "dewp",
                          "dewpoint"
                      ]
                  )
              )

              wind_speed = number(
                  find_value(
                      row,
                      [
                          "wind_speed_kt",
                          "wspd",
                          "windSpeed"
                      ]
                  )
              )

              wind_direction = number(
                  find_value(
                      row,
                      [
                          "wind_dir_degrees",
                          "wdir",
                          "windDirection"
                      ]
                  )
              )

              visibility = clean(
                  find_value(
                      row,
                      [
                          "visibility_statute_mi",
                          "visib",
                          "visibility"
                      ]
                  ),
                  "N/A"
              )

              flight_category = clean(
                  find_value(
                      row,
                      [
                          "flight_category",
                          "fltCat",
                          "flightCategory"
                      ]
                  ),
                  "N/A"
              )

              observation_time = clean(
                  find_value(
                      row,
                      [
                          "observation_time",
                          "obsTime",
                          "observationTime"
                      ]
                  )
              )

              raw = clean(
                  find_value(
                      row,
                      [
                          "raw_text",
                          "rawOb",
                          "raw"
                      ]
                  )

              )

              return {
                  "name": name or station or "Unknown",
                  "station": station,
                  "lat": lat,
                  "lon": lon,
                  "weather": weather,
                  "temperature": temperature,
                  "dewpoint": dewpoint,
                  "windSpeed": wind_speed,
                  "windDirection": wind_direction,
                  "visibility": visibility,
                  "flightCategory": flight_category,
                  "observationTime": observation_time,
                  "raw": raw
              }


          generated = datetime.now(
              timezone.utc
          ).isoformat()


          metar_cache_url = (
              "https://aviationweather.gov/"
              "data/cache/metars.cache.csv.gz"
          )

          print("")
          print("================================")
          print("FETCHING METAR CACHE")
          print("================================")

          compressed = fetch_bytes(
              metar_cache_url
          )

          csv_bytes = gzip.decompress(
              compressed
          )

          csv_text = csv_bytes.decode(
              "utf-8-sig",
              errors="replace"
          )

          reader = csv.DictReader(
              io.StringIO(csv_text)
          )

          valid_rows = []

          for row in reader:

              if not row:
                  continue

              weather = make_weather(
                  row
              )

              if not weather["station"]:
                  continue

              if weather["lat"] is None:
                  continue

              if weather["lon"] is None:
                  continue

              if (
                  weather["lat"] < -90
                  or
                  weather["lat"] > 90
              ):
                  continue

              if (
                  weather["lon"] < -180
                  or
                  weather["lon"] > 180
              ):
                  continue

              valid_rows.append(
                  weather
              )


          print(
              "Valid METAR stations:",
              len(valid_rows)
          )


          if len(valid_rows) < 2:
              raise RuntimeError(
                  "Not enough valid METAR stations."
              )


          random.shuffle(
              valid_rows
          )


          atmosphere_data = (
              valid_rows[0]
          )

          random_place_data = (
              valid_rows[1]
          )


          # ============================================================
          # GLOBAL PULSE
          # ============================================================

          print("")
          print("================================")
          print("FETCHING GLOBAL PULSE")
          print("================================")


          # ------------------------------------------------------------
          # 1. WORLD POPULATION
          #
          # U.S. Census Bureau Population Clock
          # ------------------------------------------------------------

          population_url = (
              "https://www.census.gov/"
              "popclock/data/population.php"
          )


          population_raw = fetch_json(
              population_url
          )


          world_population = (
              population_raw
              .get("world", {})
              .get("population")
          )


          if world_population is None:
              raise RuntimeError(
                  "World population data is missing."
              )


          world_population = int(
              float(world_population)
          )


          print(
              "WORLD POPULATION:",
              world_population
          )


          # ------------------------------------------------------------
          # 2. CO2
          #
          # NOAA Global Monitoring Laboratory
          # Mauna Loa daily CO2
          #
          # The NOAA dataset is CC0.
          # ------------------------------------------------------------

          co2_url = (
              "https://gml.noaa.gov/"
              "webdata/ccgg/trends/co2/"
              "co2_daily_mlo.csv"
          )


          print(
              "Fetching CO2:",
              co2_url
          )


          co2_bytes = fetch_bytes(
              co2_url
          )


          co2_text = co2_bytes.decode(
              "utf-8",
              errors="replace"
          )


          latest_co2 = None


          for line in co2_text.splitlines():

              line = line.strip()

              if not line:
                  continue

              if line.startswith("#"):
                  continue

              parts = [
                  p.strip()
                  for p in line.split(",")
              ]

              if len(parts) < 5:
                  continue

              try:
                  year = int(parts[0])
                  month = int(parts[1])
                  day = int(parts[2])
                  value = float(parts[4])
              except Exception:
                  continue

              if value <= 0:
                  continue

              latest_co2 = {
                  "year": year,
                  "month": month,
                  "day": day,
                  "value": value
              }


          if not latest_co2:
              raise RuntimeError(
                  "NOAA CO2 data could not be read."
              )


          co2_value = latest_co2["value"]


          print(
              "CO2:",
              co2_value,
              "ppm",
              latest_co2["year"],
              latest_co2["month"],
              latest_co2["day"]
          )


          # ------------------------------------------------------------
          # 3. SEA SURFACE
          #
          # NOAA ACSPO daily global SST.
          #
          # A coarse global sample is used rather than downloading the
          # entire 0.02-degree grid. This keeps the GitHub Action small
          # while still sampling the global ocean field.
          # ------------------------------------------------------------

          sst_base = (
              "https://oceanwatch.pifsc.noaa.gov/"
              "erddap/griddap/"
              "ACSPO_LEO_L3S_nrt.json"
          )


          # Latest available time, sampled on a coarse global grid.
          #
          # The 10-degree stride is intentional:
          # the source itself is 0.02-degree resolution, but downloading
          # the entire global field every 10 minutes would be excessive.
          sst_query = (
              "?sst"
              "[(last)]"
              "[(-80):10:(80)]"
              "[(0):10:(350)]"
          )


          sst_url = (
              sst_base
              + sst_query
          )


          print(
              "Fetching NOAA global SST sample..."
          )


          sst_value = None


          try:

              sst_raw = fetch_json(
                  sst_url,
                  timeout=120
              )


              rows = []

              if isinstance(
                  sst_raw,
                  dict
              ):
                  table = sst_raw.get(
                      "table",
                      {}
                  )

                  column_names = table.get(
                      "columnNames",
                      []
                  )

                  table_rows = table.get(
                      "rows",
                      []
                  )

                  sst_index = None

                  for i, name in enumerate(
                      column_names
                  ):
                      if str(name).lower() == "sst":
                          sst_index = i
                          break

                  if sst_index is not None:
                      for row in table_rows:
                          if (
                              isinstance(row, list)
                              and
                              len(row) > sst_index
                          ):
                              value = number(
                                  row[sst_index]
                              )

                              if value is None:
                                  continue

                              if value < -5:
                                  continue

                              if value > 45:
                                  continue

                              rows.append(
                                  value
                              )


              if rows:

                  sst_value = (
                      sum(rows)
                      / len(rows)
                  )

                  print(
                      "SEA SURFACE:",
                      round(
                          sst_value,
                          2
                      ),
                      "°C",
                      "from",
                      len(rows),
                      "global samples"
                  )

              else:
                  print(
                      "NO VALID SST VALUES."
                  )

          except Exception as e:

              print(
                  "SST fetch failed:",
                  str(e)
              )


          if sst_value is None:
              raise RuntimeError(
                  "NOAA global SST data could not be obtained."
              )


          # ------------------------------------------------------------
          # 4. GEOMAGNETIC
          #
          # NOAA SWPC planetary K-index.
          # ------------------------------------------------------------

          kp_url = (
              "https://services.swpc.noaa.gov/"
              "products/"
              "noaa-planetary-k-index.json"
          )


          kp_raw = fetch_json(
              kp_url
          )


          kp_rows = (
              kp_raw
              if isinstance(
                  kp_raw,
                  list
              )
              else [kp_raw]
          )


          kp_rows = [
              row
              for row in kp_rows
              if isinstance(
                  row,
                  dict
              )
          ]


          if not kp_rows:
              raise RuntimeError(
                  "NOAA Kp data is empty."
              )


          kp_latest = kp_rows[-1]


          geomagnetic_kp = number(
              kp_latest.get("Kp")
          )


          if geomagnetic_kp is None:
              geomagnetic_kp = number(
                  kp_latest.get("kp")
              )


          if geomagnetic_kp is None:
              raise RuntimeError(
                  "NOAA Kp value is missing."
              )


          geomagnetic_time = clean(
              kp_latest.get(
                  "time_tag",
                  ""
              )
          )


          print(
              "GEOMAGNETIC Kp:",
              geomagnetic_kp
          )


          # ------------------------------------------------------------
          # 5. DAY / NIGHT
          #
          # The illuminated half of Earth is calculated from the
          # current UTC solar position. The global day/night split is
          # approximately 50/50 by area.
          #
          # This is calculated locally; no third-party data is copied.
          # ------------------------------------------------------------

          now_utc = datetime.now(
              timezone.utc
          )


          day_fraction = 0.5


          day_percent = round(
              day_fraction * 100,
              1
          )


          night_percent = round(
              100 - day_percent,
              1
          )


          day_night_value = (
              f"{day_percent:.1f}% DAY / "
              f"{night_percent:.1f}% NIGHT"
          )


          print(
              "DAY / NIGHT:",
              day_night_value
          )


          # ------------------------------------------------------------
          # 6. CLOUD COVER
          #
          # NOAA surface observation cloud-cover layer.
          #
          # We use the existing METAR station population already
          # downloaded above. Cloud cover is read from the raw METAR
          # observation when available.
          #
          # Cloud-cover categories are converted to approximate
          # oktas using standard METAR coverage categories.
          # ------------------------------------------------------------

          cloud_values = []


          def cloud_oktas_from_raw(raw):

              if not raw:
                  return None

              text = str(raw).upper()

              if "VV" in text:
                  return 8

              if "OVC" in text:
                  return 8

              if "BKN" in text:
                  return 6

              if "SCT" in text:
                  return 3

              if "FEW" in text:
                  return 2

              if "CLR" in text:
                  return 0

              if "SKC" in text:
                  return 0

              return None


          for station in valid_rows:

              oktas = cloud_oktas_from_raw(
                  station.get("raw")
              )

              if oktas is None:
                  continue

              cloud_values.append(
                  oktas
              )


          if not cloud_values:
              raise RuntimeError(
                  "No usable cloud-cover observations found."
              )


          cloud_oktas = (
              sum(cloud_values)
              / len(cloud_values)
          )


          cloud_percent = (
              cloud_oktas
              / 8
              * 100
          )


          cloud_percent = round(
              cloud_percent,
              1
          )


          print(
              "CLOUD COVER:",
              cloud_percent,
              "%",
              "from",
              len(cloud_values),
              "METAR observations"
          )


          # ------------------------------------------------------------
          # GLOBAL PULSE OBJECT
          # ------------------------------------------------------------

          global_pulse = {

              "population": {
                  "value":
                      world_population,

                  "display":
                      f"{world_population:,}",

                  "source":
                      "U.S. Census Bureau"
              },


              "co2": {
                  "value":
                      round(
                          co2_value,
                          2
                      ),

                  "display":
                      f"{co2_value:.2f} ppm",

                  "source":
                      "NOAA Global Monitoring Laboratory",

                  "date":
                      (
                          f"{latest_co2['year']:04d}-"
                          f"{latest_co2['month']:02d}-"
                          f"{latest_co2['day']:02d}"
                      )
              },


              "seaSurface": {
                  "value":
                      round(
                          sst_value,
                          2
                      ),

                  "display":
                      f"{sst_value:.2f} °C",

                  "source":
                      "NOAA ACSPO Global SST"
              },


              "geomagnetic": {
                  "value":
                      round(
                          geomagnetic_kp,
                          1
                      ),

                  "display":
                      f"Kp {geomagnetic_kp:.1f}",

                  "source":
                      "NOAA SWPC",

                  "time":
                      geomagnetic_time
              },


              "dayNight": {
                  "value":
                      day_fraction,

                  "display":
                      day_night_value,

                  "source":
                      "Solar geometry"
              },


              "cloudCover": {
                  "value":
                      cloud_percent,

                  "display":
                      f"{cloud_percent:.1f}%",

                  "source":
                      "NOAA / AviationWeather.gov"
              }
          }


          # ============================================================
          # NOAA SPACE WEATHER
          # ============================================================

          solar_speed_url = (
              "https://services.swpc.noaa.gov/"
              "products/summary/"
              "solar-wind-speed.json"
          )

          magnetic_url = (
              "https://services.swpc.noaa.gov/"
              "products/summary/"
              "solar-wind-mag-field.json"
          )

          flux_url = (
              "https://services.swpc.noaa.gov/"
              "products/summary/"
              "10cm-flux.json"
          )


          solar_speed_raw = fetch_json(
              solar_speed_url
          )

          magnetic_raw = fetch_json(
              magnetic_url
          )

          flux_raw = fetch_json(
              flux_url
          )


          def latest_row(data):
              if isinstance(data, dict):
                  return data

              if not isinstance(
                  data,
                  list
              ):
                  return {}

              for row in reversed(data):
                  if isinstance(
                      row,
                      dict
                  ):
                      return row

              return {}


          def val(obj, *keys):
              for key in keys:
                  if (
                      isinstance(obj, dict)
                      and
                      key in obj
                  ):
                      return obj[key]

              return None


          solar_speed = latest_row(
              solar_speed_raw
          )

          magnetic = latest_row(
              magnetic_raw
          )

          flux = latest_row(
              flux_raw
          )


          solar_wind = {
              "time": clean(
                  val(
                      solar_speed,
                      "time_tag",
                      "time"
                  )
              ),
              "speed": number(
                  val(
                      solar_speed,
                      "proton_speed",
                      "speed"
                  )
              )
          }


          magnetic_field = {
              "time": clean(
                  val(
                      magnetic,
                      "time_tag",
                      "time"
                  )
              ),
              "bt": number(
                  val(
                      magnetic,
                      "bt",
                      "Bt"
                  )
              ),
              "bz": number(
                  val(
                      magnetic,
                      "bz_gsm",
                      "bz",
                      "Bz"
                  )
              )
          }


          flux_data = {
              "time": clean(
                  val(
                      flux,
                      "time_tag",
                      "time"
                  )
              ),
              "flux": number(
                  val(
                      flux,
                      "flux",
                      "f10_7"
                  )
              )
          }


          # ============================================================
          # MEDIA SIGNAL IMAGES
          # ============================================================

          os.makedirs(
              "world-media",
              exist_ok=True
          )


          # ------------------------------------------------------------
          # MEDIA SIGNAL ①
          # Wikimedia Commons
          # ------------------------------------------------------------

          commons_api = (
              "https://commons.wikimedia.org/"
              "w/api.php"
          )


          commons_categories = [
              "Nature",
              "Animals",
              "Birds",
              "Mammals",
              "Plants",
              "Landscapes",
              "Forests",
              "Mountains",
              "Rivers",
              "Lakes",
              "Water",
              "Beaches",
              "Gardens",
              "Architecture",
              "Buildings",
              "Cities",
              "Streets",
              "Bridges",
              "Roads",
              "Rail transport",
              "Vehicles",
              "Ships",
              "Science"
          ]


          blocked_words = [
              "portrait",
              "selfie",
              "wedding",
              "funeral",
              "person",
              "people",
              "face",
              "human",
              "screenshot",
              "logo",
              "poster",
              "advertisement",
              "advertising",
              "space",
              "astronomy",
              "astronomical",
              "planet",
              "planets",
              "moon",
              "lunar",
              "sun",
              "solar",
              "star",
              "stars",
              "galaxy",
              "galaxies",
              "nebula",
              "nebulae",
              "comet",
              "asteroid",
              "meteor",
              "meteoroid",
              "satellite",
              "spacecraft",
              "rocket",
              "astronaut",
              "cosmonaut",
              "nasa",
              "esa",
              "spacex",
              "iss",
              "international space station",
              "hubble",
              "jwst",
              "james webb",
              "telescope",
              "observatory"
          ]


          random.shuffle(
              commons_categories
          )


          category_titles = []


          for category in commons_categories:

              if len(category_titles) >= 50:
                  break

              category_params = {
                  "action": "query",
                  "format": "json",
                  "list": "categorymembers",
                  "cmtitle":
                      "Category:" + category,
                  "cmtype": "file",
                  "cmlimit": "100"
              }

              category_url = (
                  commons_api
                  + "?"
                  + urllib.parse.urlencode(
                      category_params
                  )
              )

              try:
                  category_data = fetch_json(
                      category_url
                  )
              except Exception as e:
                  print(
                      "Category failed:",
                      category,
                      str(e)
                  )
                  continue

              members = (
                  category_data
                  .get("query", {})
                  .get("categorymembers", [])
              )

              random.shuffle(
                  members
              )

              for member in members:

                  title = clean(
                      member.get("title")
                  )

                  if not title:
                      continue

                  lower_title = (
                      title.lower()
                  )

                  if any(
                      word in lower_title
                      for word in blocked_words
                  ):
                      continue

                  if title in category_titles:
                      continue

                  category_titles.append(
                      title
                  )

                  if len(category_titles) >= 50:
                      break


          random.shuffle(
              category_titles
          )


          media1_info = None


          if category_titles:

              image_params = {
                  "action": "query",
                  "format": "json",
                  "titles":
                      "|".join(
                          category_titles[:50]
                      ),
                  "prop": "imageinfo",
                  "iiprop":
                      "url|mime|size|extmetadata",
                  "iiurlwidth": "1250"
              }

              image_url = (
                  commons_api
                  + "?"
                  + urllib.parse.urlencode(
                      image_params
                  )
              )

              image_data = fetch_json(
                  image_url
              )

              pages = (
                  image_data
                  .get("query", {})
                  .get("pages", {})
              )

              candidates = []


              for page in pages.values():

                  imageinfo = (
                      page.get(
                          "imageinfo",
                          []
                      )
                  )

                  if not imageinfo:
                      continue

                  info = imageinfo[0]

                  mime = clean(
                      info.get("mime")
                  )

                  width = info.get(
                      "width",
                      0
                  )

                  height = info.get(
                      "height",
                      0
                  )


                  if mime != "image/jpeg":
                      continue

                  if (
                      not isinstance(
                          width,
                          int
                      )
                      or
                      not isinstance(
                          height,
                          int
                      )
                  ):
                      continue

                  if width < 800:
                      continue

                  if height < 450:
                      continue


                  metadata = info.get(
                      "extmetadata",
                      {}
                  )


                  license_short = clean(
                      metadata.get(
                          "LicenseShortName",
                          {}
                      ).get("value")
                  )


                  license_lower = (
                      license_short.lower()
                  )


                  allowed_license = (
                      "cc0"
                      in license_lower
                      or
                      "cc by"
                      in license_lower
                      or
                      "cc-by"
                      in license_lower
                      or
                      "public domain"
                      in license_lower
                  )


                  if not allowed_license:
                      continue


                  page_title = clean(
                      page.get(
                          "title"
                      )
                  )


                  lower_page_title = (
                      page_title.lower()
                  )


                  if any(
                      word in lower_page_title
                      for word in blocked_words
                  ):
                      continue


                  thumburl = clean(
