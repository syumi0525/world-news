      - name: Verify world-data.json
        run: |
          python - <<'PY'
          import json
          import os


          with open(
              "world-data.json",
              "r",
              encoding="utf-8"
          ) as f:
              data = json.load(f)


          atmosphere = data.get(
              "atmosphere"
          )

          random_place = data.get(
              "randomPlace"
          )

          global_pulse = data.get(
              "globalPulse"
          )

          space = data.get(
              "space"
          )

          images = data.get(
              "images"
          )

          media1 = data.get(
              "mediaSignal1"
          )

          media2 = data.get(
              "mediaSignal2"
          )


          if not isinstance(
              atmosphere,
              dict
          ) or not atmosphere:
              raise RuntimeError(
                  "Atmosphere data is empty."
              )


          if not isinstance(
              random_place,
              dict
          ) or not random_place:
              raise RuntimeError(
                  "Random Place data is empty."
              )


          if (
              random_place.get("lat") is None
              or
              random_place.get("lon") is None
          ):
              raise RuntimeError(
                  "Random Place coordinates are missing."
              )


          if not isinstance(
              global_pulse,
              dict
          ) or not global_pulse:
              raise RuntimeError(
                  "GLOBAL PULSE data is missing."
              )


          required_global_pulse = [
              "population",
              "co2",
              "seaSurface",
              "geomagnetic",
              "dayNight",
              "cloudCover"
          ]


          for key in required_global_pulse:

              item = global_pulse.get(
                  key
              )

              if not isinstance(
                  item,
                  dict
              ):
                  raise RuntimeError(
                      "GLOBAL PULSE field is missing: "
                      + key
                  )

              if not item.get(
                  "display"
              ):
                  raise RuntimeError(
                      "GLOBAL PULSE display is missing: "
                      + key
                  )


          if not isinstance(
              space,
              dict
          ) or not space:
              raise RuntimeError(
                  "Space Weather data is empty."
              )


          if not isinstance(
              images,
              dict
          ):
              raise RuntimeError(
                  "Images data is missing."
              )


          if not images.get(
              "media1"
          ):
              raise RuntimeError(
                  "MEDIA SIGNAL ① is missing."
              )


          if not images.get(
              "media2"
          ):
              raise RuntimeError(
                  "MEDIA SIGNAL ② is missing."
              )


          if not os.path.exists(
              "world-media/media1.jpg"
          ):
              raise RuntimeError(
                  "MEDIA SIGNAL ① image file is missing."
              )


          if not os.path.exists(
              "world-media/media2.jpg"
          ):
              raise RuntimeError(
                  "MEDIA SIGNAL ② image file is missing."
              )


          if not isinstance(
              media1,
              dict
          ) or not media1.get(
              "license"
          ):
              raise RuntimeError(
                  "MEDIA SIGNAL ① license metadata is missing."
              )


          if not isinstance(
              media2,
              dict
          ) or not media2.get(
              "source"
          ):
              raise RuntimeError(
                  "MEDIA SIGNAL ② source metadata is missing."
              )


          print(
              "================================"
          )

          print(
              "Verification OK"
          )

          print(
              "Atmosphere:",
              atmosphere.get("name")
          )

          print(
              "Random Place:",
              random_place.get("name")
          )

          print(
              "Coordinates:",
              random_place.get("lat"),
