name: Update WORLD NEWS data

on:
  workflow_dispatch:
  schedule:
    - cron: "*/10 * * * *"

permissions:
  contents: write

jobs:
  update-world-data:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Update WORLD NEWS
        run: |
          python - <<'PY'
          import json
          import os
          import random
          import urllib.request
          from datetime import datetime, timezone

          UA = "WORLD-NEWS/1.0"

          def fetch_json(url):
              req = urllib.request.Request(
                  url,
                  headers={
                      "User-Agent": UA,
                      "Accept": "application/json",
                  },
              )

              with urllib.request.urlopen(req, timeout=30) as r:
                  return json.loads(
                      r.read().decode("utf-8")
                  )

          def download(url, path):
              req = urllib.request.Request(
                  url,
                  headers={
                      "User-Agent": UA
                  },
              )

              with urllib.request.urlopen(
                  req,
                  timeout=60
              ) as r:
                  data = r.read()

              if len(data) < 1000:
                  raise RuntimeError(
                      "Downloaded image is too small"
                  )

              with open(path, "wb") as f:
                  f.write(data)

          def clean(value, default=""):
              if value is None:
                  return default

              return str(value).strip()

          def number(value):
              try:
                  if value is None:
                      return None

                  text = str(value).strip()

                  if not text:
                      return None

                  return float(text)

              except Exception:
                  return None

          def make_weather(m):
              return {
                  "name": clean(
                      m.get("name"),
                      clean(
                          m.get("icaoId"),
                          "Unknown"
                      )
                  ),

                  "station": clean(
                      m.get("icaoId")
                  ),

                  "lat": number(
                      m.get("lat")
                  ),

                  "lon": number(
                      m.get("lon")
                  ),

                  "weather": clean(
                      m.get("wxString"),
                      "No coded weather"
                  ),

                  "temperature": number(
                      m.get("temp")
                  ),

                  "dewpoint": number(
                      m.get("dewp")
                  ),

                  "windSpeed": number(
                      m.get("wspd")
                  ),

                  "windDirection": number(
                      m.get("wdir")
                  ),

                  "visibility": clean(
                      m.get("visib"),
                      "N/A"
                  ),

                  "flightCategory": clean(
                      m.get("fltCat"),
                      "N/A"
                  ),

                  "observationTime": clean(
                      m.get("obsTime")
                  ),

                  "raw": clean(
                      m.get("rawOb")
                  )
              }

          generated = datetime.now(
              timezone.utc
          ).isoformat()

          # ============================================================
          # WEATHER / RANDOM PLACE
          # ============================================================

          metar_url = (
              "https://aviationweather.gov/api/data/metar"
              "?format=json&hours=2"
          )

          print("")
          print("================================")
          print("FETCHING METAR")
          print("================================")
          print(metar_url)

          metars = fetch_json(
              metar_url
          )

          print(
              "METAR response type:",
              type(metars).__name__
          )

          if not isinstance(metars, list):
              raise RuntimeError(
                  "METAR API did not return a list."
              )

          print(
              "METAR records:",
              len(metars)
          )

          stations = []

          for m in metars:

              if not isinstance(
                  m,
                  dict
              ):
                  continue

              icao = clean(
                  m.get("icaoId")
              )

              lat = number(
                  m.get("lat")
              )

              lon = number(
                  m.get("lon")
              )

              if not icao:
                  continue

              if lat is None:
                  continue

              if lon is None:
                  continue

              # 明らかにおかしい座標を除外
              if lat < -90 or lat > 90:
                  continue

              if lon < -180 or lon > 180:
                  continue

              stations.append(m)

          print(
              "Valid stations:",
              len(stations)
          )

          if len(stations) < 2:
              raise RuntimeError(
                  "Not enough valid METAR stations."
              )

          # ============================================================
          # RANDOM PLACE
          # ============================================================

          random.shuffle(
              stations
          )

          atmosphere_station = stations[0]
          random_station = stations[1]

          atmosphere_data = make_weather(
              atmosphere_station
          )

          random_place_data = make_weather(
              random_station
          )

          print("")
          print(
              "ATMOSPHERE:",
              atmosphere_data
          )

          print(
              "RANDOM PLACE:",
              random_place_data
          )

          # 絶対に座標なしのRandom Placeを保存しない
          if (
              random_place_data["lat"] is None
              or
              random_place_data["lon"] is None
          ):
              raise RuntimeError(
                  "Random Place has no valid coordinates."
              )

          # ============================================================
          # NOAA SPACE WEATHER
          # ============================================================

          solar_speed_url = (
              "https://services.swpc.noaa.gov/"
              "products/solar-wind/"
              "solar-wind-speed.json"
          )

          magnetic_url = (
              "https://services.swpc.noaa.gov/"
              "products/solar-wind/"
              "solar-wind-mag-field.json"
          )

          kp_url = (
              "https://services.swpc.noaa.gov/"
              "products/"
              "noaa-planetary-k-index.json"
          )

          flux_url = (
              "https://services.swpc.noaa.gov/"
              "products/"
              "10cm-flux-30-day.json"
          )

          solar_speed_raw = fetch_json(
              solar_speed_url
          )

          magnetic_raw = fetch_json(
              magnetic_url
          )

          kp_raw = fetch_json(
              kp_url
          )

          flux_raw = fetch_json(
              flux_url
          )

          def latest_row(data):
              if not isinstance(
                  data,
                  list
              ):
                  return {}

              for row in reversed(data):

                  if not isinstance(
                      row,
                      dict
                  ):
                      continue

                  # ヘッダー行を避ける
                  if any(
                      value not in (
                          None,
                          "",
                          "time_tag"
                      )
                      for value in row.values()
                  ):
                      return row

              return {}

          def val(obj, *keys):
              for key in keys:

                  if (
                      isinstance(obj, dict)
                      and key in obj
                  ):
                      return obj[key]

              return None

          solar_speed = latest_row(
              solar_speed_raw
          )

          magnetic = latest_row(
              magnetic_raw
          )

          kp = latest_row(
              kp_raw
          )

          flux = latest_row(
              flux_raw
          )

          solar_wind = {
              "time": clean(
                  val(
                      solar_speed,
                      "time_tag",
                      "time"
                  )
              ),

              "speed": number(
                  val(
                      solar_speed,
                      "proton_speed",
                      "speed"
                  )
              )
          }

          magnetic_field = {
              "time": clean(
                  val(
                      magnetic,
                      "time_tag",
                      "time"
                  )
              ),

              "bt": number(
                  val(
                      magnetic,
                      "bt",
                      "Bt"
                  )
              ),

              "bz": number(
                  val(
                      magnetic,
                      "bz_gsm",
                      "bz",
                      "Bz"
                  )
              )
          }

          kp_data = {
              "time": clean(
                  val(
                      kp,
                      "time_tag",
                      "time"
                  )
              ),

              "kp": number(
                  val(
                      kp,
                      "Kp",
                      "kp"
                  )
              )
          }

          flux_data = {
              "time": clean(
                  val(
                      flux,
                      "time_tag",
                      "time"
                  )
              ),

              "flux": number(
                  val(
                      flux,
                      "flux",
                      "f10_7"
                  )
              )
          }

          # ============================================================
          # SATELLITE IMAGES
          # ============================================================

          os.makedirs(
              "world-media",
              exist_ok=True
          )

          image_sources = {

              "earth":
                  "https://cdn.star.nesdis.noaa.gov/"
                  "GOES19/ABI/CONUS/"
                  "GEOCOLOR/1250x750.jpg",

              "media1":
                  "https://cdn.star.nesdis.noaa.gov/"
                  "GOES19/GLM/CONUS/"
                  "EXTENT3/1250x750.jpg",

              "media2":
                  "https://cdn.star.nesdis.noaa.gov/"
                  "GOES19/ABI/CONUS/"
                  "DMW/1250x750.jpg"
          }

          for key, url in image_sources.items():

              path = (
                  f"world-media/{key}.jpg"
              )

              try:

                  print(
                      "Downloading:",
                      key
                  )

                  download(
                      url,
                      path
                  )

                  print(
                      "Downloaded:",
                      os.path.getsize(path),
                      "bytes"
                  )

              except Exception as e:

                  print(
                      "Image failed:",
                      key,
                      e
                  )

                  if not os.path.exists(
                      path
                  ):
                      raise

          # ============================================================
          # SAVE WORLD DATA
          # ============================================================

          world = {

              "generatedAt":
                  generated,

              "sources": {

                  "weather":
                      "AviationWeather.gov",

                  "spaceWeather":
                      "NOAA SWPC",

                  "satellite":
                      "NOAA GOES"
              },

              "images": {

                  "earth":
                      "world-media/earth.jpg",

                  "media1":
                      "world-media/media1.jpg",

                  "media2":
                      "world-media/media2.jpg"
              },

              "atmosphere":
                  atmosphere_data,

              "randomPlace":
                  random_place_data,

              "space": {

                  "solarWind":
                      solar_wind,

                  "magneticField":
                      magnetic_field,

                  "interplanetary": {

                      "solarWind":
                          solar_wind,

                      "magneticField":
                          magnetic_field
                  },

                  "kp":
                      kp_data,

                  "flux10cm":
                      flux_data
              }
          }

          with open(
              "world-data.json",
              "w",
              encoding="utf-8"
          ) as f:

              json.dump(
                  world,
                  f,
                  ensure_ascii=False,
                  indent=2
              )

          print("")
          print("================================")
          print("WORLD NEWS UPDATED")
          print("================================")

          print(
              "Atmosphere:",
              atmosphere_data["name"]
          )

          print(
              "Random:",
              random_place_data["name"]
          )

          print(
              "Random coordinates:",
              random_place_data["lat"],
              random_place_data["lon"]
          )

          print(
              "Solar Wind:",
              solar_wind
          )

          print(
              "Magnetic:",
              magnetic_field
          )

          print(
              "Kp:",
              kp_data
          )

          print(
              "Flux:",
              flux_data
          )

          print("================================")

          PY

      - name: Verify world-data.json
        run: |
          python - <<'PY'
          import json

          with open(
              "world-data.json",
              "r",
              encoding="utf-8"
          ) as f:
              data = json.load(f)

          random_place = data.get(
              "randomPlace",
              {}
          )

          atmosphere = data.get(
              "atmosphere",
              {}
          )

          if not random_place:
              raise RuntimeError(
                  "randomPlace is empty."
              )

          if (
              random_place.get("lat") is None
              or
              random_place.get("lon") is None
          ):
              raise RuntimeError(
                  "randomPlace coordinates are missing."
              )

          if not atmosphere:
              raise RuntimeError(
                  "atmosphere is empty."
              )

          print(
              "Verification OK"
          )

          print(
              "Random:",
              random_place.get("name")
          )

          print(
              "Coordinates:",
              random_place.get("lat"),
              random_place.get("lon")
          )

          print(
              "Atmosphere:",
              atmosphere.get("name")
          )
          PY

      - name: Commit updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add world-data.json world-media/

          if git diff --cached --quiet; then
            echo "No changes."
          else
            git commit -m "Update WORLD NEWS data"
            git push
          fi
