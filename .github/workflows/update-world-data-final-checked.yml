name: Update WORLD NEWS data

on:
  workflow_dispatch:
  schedule:
    - cron: "*/10 * * * *"

permissions:
  contents: write

jobs:
  update-world-data:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Update WORLD NEWS
        run: |
          python - <<'PY'
          import csv
          import gzip
          import io
          import json
          import math
          import os
          import random
          import time
          import re
          import urllib.parse
          import urllib.request
          import urllib.error
          from datetime import datetime, timezone, timedelta


          UA = "WORLD-NEWS/1.0"


          # ============================================================
          # COMMON FUNCTIONS
          # ============================================================

          def fetch_json(url, timeout=60, attempts=5):
              last_error = None

              for attempt in range(attempts):
                  req = urllib.request.Request(
                      url,
                      headers={
                          "User-Agent": UA,
                          "Accept": "application/json",
                      },
                  )

                  try:
                      with urllib.request.urlopen(
                          req,
                          timeout=timeout
                      ) as response:
                          return json.loads(
                              response.read().decode("utf-8")
                          )

                  except urllib.error.HTTPError as exc:
                      last_error = exc

                      if exc.code != 429 or attempt >= attempts - 1:
                          raise

                      retry_after = exc.headers.get("Retry-After")

                      try:
                          delay = int(retry_after)
                      except (TypeError, ValueError):
                          delay = 2 ** attempt

                      delay = max(2, min(delay, 60))

                      print(
                          f"HTTP 429 for {url}; retrying in {delay}s "
                          f"({attempt + 1}/{attempts - 1})"
                      )

                      time.sleep(delay)

              raise last_error


          def fetch_bytes(url, timeout=60, attempts=5):
              last_error = None

              for attempt in range(attempts):
                  req = urllib.request.Request(
                      url,
                      headers={
                          "User-Agent": UA
                      },
                  )

                  try:
                      with urllib.request.urlopen(
                          req,
                          timeout=timeout
                      ) as response:
                          return response.read()
                  except urllib.error.HTTPError as exc:
                      last_error = exc

                      if exc.code != 429 or attempt >= attempts - 1:
                          raise

                      retry_after = exc.headers.get("Retry-After")

                      try:
                          delay = int(retry_after)
                      except (TypeError, ValueError):
                          delay = 2 ** attempt

                      delay = max(2, min(delay, 60))

                      print(
                          f"HTTP 429 for {url}; retrying in {delay}s "
                          f"({attempt + 1}/{attempts - 1})"
                      )

                      time.sleep(delay)

              raise last_error


          def download(url, path):
              data = fetch_bytes(url)

              if len(data) < 1000:
                  raise RuntimeError(
                      "Downloaded image is too small."
                  )

              with open(path, "wb") as f:
                  f.write(data)


          def clean(value, default=""):
              if value is None:
                  return default

              return str(value).strip()


          def number(value):
              try:
                  if value is None:
                      return None

                  text = str(value).strip()

                  if not text:
                      return None

                  value = float(text)

                  if not math.isfinite(value):
                      return None

                  return value

              except Exception:
                  return None


          def find_value(row, names):
              for name in names:
                  if name in row:
                      value = row[name]

                      if (
                          value is not None
                          and str(value).strip() != ""
                      ):
                          return value

              return None


          def parse_datetime(value):
              if value is None:
                  return None

              if isinstance(value, (int, float)):
                  try:
                      return datetime.fromtimestamp(
                          float(value),
                          tz=timezone.utc
                      )
                  except Exception:
                      return None

              text = str(value).strip()
              if not text:
                  return None

              if text.endswith("Z"):
                  text = text[:-1] + "+00:00"

              try:
                  dt = datetime.fromisoformat(text)
                  if dt.tzinfo is None:
                      dt = dt.replace(tzinfo=timezone.utc)
                  return dt.astimezone(timezone.utc)
              except Exception:
                  pass

              for fmt in (
                  "%Y-%m-%d %H:%M:%S",
                  "%Y-%m-%d %H:%M",
                  "%Y%m%d%H%M%S",
                  "%Y%m%d%H%M",
              ):
                  try:
                      return datetime.strptime(
                          text,
                          fmt
                      ).replace(tzinfo=timezone.utc)
                  except Exception:
                      continue

              return None


          def latest_timestamped_row(data, time_keys):
              rows = []

              if isinstance(data, dict):
                  rows = [data]
              elif isinstance(data, list):
                  rows = [
                      row
                      for row in data
                      if isinstance(row, dict)
                  ]

              best_row = None
              best_time = None

              for row in rows:
                  timestamp = None
                  for key in time_keys:
                      if key in row and row[key] not in (None, ""):
                          timestamp = parse_datetime(row[key])
                          if timestamp is not None:
                              break

                  if timestamp is None:
                      continue

                  if best_time is None or timestamp > best_time:
                      best_time = timestamp
                      best_row = row

              return best_row, best_time


          # ============================================================
          # METAR
          # ============================================================

          def make_weather(row):
              lat = number(
                  find_value(
                      row,
                      [
                          "latitude",
                          "lat"
                      ]
                  )
              )

              lon = number(
                  find_value(
                      row,
                      [
                          "longitude",
                          "lon"
                      ]
                  )
              )

              station = clean(
                  find_value(
                      row,
                      [
                          "station_id",
                          "icaoId",
                          "station"
                      ]
                  )
              )

              name = clean(
                  find_value(
                      row,
                      [
                          "station_name",
                          "name"
                      ]
                  )
              )

              weather = clean(
                  find_value(
                      row,
                      [
                          "wx_string",
                          "wxString",
                          "weather"
                      ]
                  ),
                  "No coded weather"
              )

              temperature = number(
                  find_value(
                      row,
                      [
                          "temp_c",
                          "temp",
                          "temperature"
                      ]
                  )
              )

              dewpoint = number(
                  find_value(
                      row,
                      [
                          "dewpoint_c",
                          "dewp",
                          "dewpoint"
                      ]
                  )
              )

              wind_speed = number(
                  find_value(
                      row,
                      [
                          "wind_speed_kt",
                          "wspd",
                          "windSpeed"
                      ]
                  )
              )

              wind_direction = number(
                  find_value(
                      row,
                      [
                          "wind_dir_degrees",
                          "wdir",
                          "windDirection"
                      ]
                  )
              )

              visibility = clean(
                  find_value(
                      row,
                      [
                          "visibility_statute_mi",
                          "visib",
                          "visibility"
                      ]
                  ),
                  "N/A"
              )

              flight_category = clean(
                  find_value(
                      row,
                      [
                          "flight_category",
                          "fltCat",
                          "flightCategory"
                      ]
                  ),
                  "N/A"
              )

              observation_time = clean(
                  find_value(
                      row,
                      [
                          "observation_time",
                          "obsTime",
                          "observationTime"
                      ]
                  )
              )

              raw = clean(
                  find_value(
                      row,
                      [
                          "raw_text",
                          "rawOb",
                          "raw"
                      ]
                  )

              )

              observation_dt = parse_datetime(
                  observation_time
              )

              return {
                  "name": name or station or "Unknown",
                  "station": station,
                  "lat": lat,
                  "lon": lon,
                  "weather": weather,
                  "temperature": temperature,
                  "dewpoint": dewpoint,
                  "windSpeed": wind_speed,
                  "windDirection": wind_direction,
                  "visibility": visibility,
                  "flightCategory": flight_category,
                  "observationTime": observation_time,
                  "observationTimestamp": (
                      observation_dt.isoformat()
                      if observation_dt is not None
                      else ""
                  ),
                  "raw": raw
              }


          metar_cache_url = (
              "https://aviationweather.gov/"
              "data/cache/metars.cache.csv.gz"
          )

          print("")
          print("================================")
          print("FETCHING METAR CACHE")
          print("================================")

          compressed = fetch_bytes(
              metar_cache_url
          )

          csv_bytes = gzip.decompress(
              compressed
          )

          csv_text = csv_bytes.decode(
              "utf-8-sig",
              errors="replace"
          )

          reader = csv.DictReader(
              io.StringIO(csv_text)
          )

          now_utc = datetime.now(
              timezone.utc
          )

          valid_rows = []

          for row in reader:
              if not row:
                  continue

              weather = make_weather(
                  row
              )

              if not weather["station"]:
                  continue

              if weather["lat"] is None or weather["lon"] is None:
                  continue

              if not (-90 <= weather["lat"] <= 90):
                  continue

              if not (-180 <= weather["lon"] <= 180):
                  continue

              observation_dt = parse_datetime(
                  weather.get("observationTime")
              )

              if observation_dt is None:
                  continue

              age = now_utc - observation_dt

              if age < timedelta(minutes=-10):
                  continue

              if age > timedelta(hours=2):
                  continue

              valid_rows.append(
                  weather
              )

          print(
              "Valid fresh METAR stations:",
              len(valid_rows)
          )

          if len(valid_rows) < 20:
              raise RuntimeError(
                  "Not enough fresh METAR stations."
              )

          random.shuffle(
              valid_rows
          )

          atmosphere_data = valid_rows[0]
          random_place_data = valid_rows[1]


          # ============================================================
          # GLOBAL PULSE
          # ============================================================

          print("")
          print("================================")
          print("FETCHING GLOBAL PULSE")
          print("================================")


          # ------------------------------------------------------------
          # 1. WORLD POPULATION
          #
          # U.S. Census Bureau Population Clock
          # ------------------------------------------------------------

          population_url = (
              "https://www.census.gov/"
              "popclock/data/population.php"
          )


          population_raw = fetch_json(
              population_url
          )


          world_population = (
              population_raw
              .get("world", {})
              .get("population")
          )


          if world_population is None:
              raise RuntimeError(
                  "World population data is missing."
              )


          world_population = int(
              float(world_population)
          )


          print(
              "WORLD POPULATION:",
              world_population
          )


          # ------------------------------------------------------------
          # 2. CO2
          #
          # NOAA Global Monitoring Laboratory
          # Globally averaged marine surface monthly mean CO2.
          # ------------------------------------------------------------

          co2_url = (
              "https://gml.noaa.gov/"
              "webdata/ccgg/trends/co2/"
              "co2_mm_gl.csv"
          )

          print(
              "Fetching global CO2:",
              co2_url
          )

          co2_text = fetch_bytes(
              co2_url
          ).decode(
              "utf-8",
              errors="replace"
          )

          latest_co2 = None
          latest_co2_date = None

          for line in co2_text.splitlines():
              line = line.strip()

              if not line or line.startswith("#"):
                  continue

              parts = [
                  p.strip()
                  for p in line.split(",")
              ]

              if len(parts) < 4:
                  continue

              try:
                  year = int(parts[0])
                  month = int(parts[1])
                  value = float(parts[3])
                  row_date = datetime(
                      year,
                      month,
                      1,
                      tzinfo=timezone.utc
                  )
              except Exception:
                  continue

              if value <= 0:
                  continue

              if latest_co2_date is None or row_date > latest_co2_date:
                  latest_co2_date = row_date
                  latest_co2 = {
                      "year": year,
                      "month": month,
                      "day": 1,
                      "value": value
                  }

          if not latest_co2:
              raise RuntimeError(
                  "NOAA global CO2 data could not be read."
              )

          if latest_co2_date > now_utc + timedelta(days=31):
              raise RuntimeError(
                  "NOAA global CO2 date is invalid."
              )

          if now_utc - latest_co2_date > timedelta(days=120):
              raise RuntimeError(
                  "NOAA global CO2 data is too old."
              )

          co2_value = latest_co2["value"]

          print(
              "GLOBAL CO2:",
              co2_value,
              "ppm",
              latest_co2["year"],
              latest_co2["month"]
          )


          # ------------------------------------------------------------
          # 4. GEOMAGNETIC
          #
          # NOAA SWPC planetary K-index.
          # ------------------------------------------------------------

          kp_url = (
              "https://services.swpc.noaa.gov/"
              "products/"
              "noaa-planetary-k-index.json"
          )


          kp_raw = fetch_json(
              kp_url
          )


          kp_rows = (
              kp_raw
              if isinstance(
                  kp_raw,
                  list
              )
              else [kp_raw]
          )


          kp_rows = [
              row
              for row in kp_rows
              if isinstance(
                  row,
                  dict
              )
          ]


          if not kp_rows:
              raise RuntimeError(
                  "NOAA Kp data is empty."
              )


          kp_latest, kp_latest_dt = latest_timestamped_row(
              kp_rows,
              ["time_tag", "time"]
          )

          if kp_latest is None or kp_latest_dt is None:
              raise RuntimeError(
                  "NOAA Kp data has no valid timestamped row."
              )

          if now_utc - kp_latest_dt > timedelta(hours=12):
              raise RuntimeError(
                  "NOAA Kp data is too old."
              )


          geomagnetic_kp = number(
              kp_latest.get("Kp")
          )


          if geomagnetic_kp is None:
              geomagnetic_kp = number(
                  kp_latest.get("kp")
              )


          if geomagnetic_kp is None:
              raise RuntimeError(
                  "NOAA Kp value is missing."
              )


          def val(obj, *keys):
              for key in keys:
                  if (
                      isinstance(obj, dict)
                      and
                      key in obj
                  ):
                      return obj[key]

              return None


          geomagnetic_time = clean(
              val(
                  kp_latest,
                  "time_tag",
                  "time"
              )
          )


          print(
              "GEOMAGNETIC Kp:",
              geomagnetic_kp
          )


          # ------------------------------------------------------------
          # SEA SURFACE TEMPERATURE
          #
          # NOAA ACSPO daily global SST (0.02 degree grid).
          # We request a coarse, latitude-weighted global sample from the
          # latest available day. Land/fill values are excluded.
          # ------------------------------------------------------------

          sst_url = (
              "https://oceanwatch.pifsc.noaa.gov/"
              "erddap/griddap/ACSPO_LEO_L3S_nrt.csv?"
              "sea_surface_temperature"
              "[last][0:500:8999][0:500:17999]"
          )

          sst_bytes = fetch_bytes(
              sst_url,
              timeout=120
          )

          sst_text = sst_bytes.decode(
              "utf-8",
              errors="replace"
          )

          sst_reader = csv.reader(
              io.StringIO(sst_text)
          )

          sst_rows = list(
              sst_reader
          )

          if len(sst_rows) < 2:
              raise RuntimeError(
                  "NOAA ACSPO SST returned no data."
              )

          sst_header = [
              str(x).strip().lower()
              for x in sst_rows[0]
          ]

          lat_index = None
          sst_index = None

          for i, name in enumerate(
              sst_header
          ):
              if name == "latitude":
                  lat_index = i
              if name == "sea_surface_temperature":
                  sst_index = i

          if lat_index is None or sst_index is None:
              raise RuntimeError(
                  "NOAA ACSPO SST response has unexpected columns."
              )

          sst_weighted_sum = 0.0
          sst_weight_sum = 0.0

          for row in sst_rows[1:]:
              if len(row) <= max(
                  lat_index,
                  sst_index
              ):
                  continue

              lat = number(
                  row[lat_index]
              )
              sst = number(
                  row[sst_index]
              )

              if lat is None or sst is None:
                  continue

              if sst < -2 or sst > 40:
                  continue

              weight = math.cos(
                  math.radians(lat)
              )

              if weight <= 0:
                  continue

              sst_weighted_sum += sst * weight
              sst_weight_sum += weight

          if sst_weight_sum <= 0:
              raise RuntimeError(
                  "NOAA ACSPO SST contained no valid global samples."
              )

          sst_value = (
              sst_weighted_sum
              / sst_weight_sum
          )

          sst_value = round(
              sst_value,
              2
          )

          print(
              "SEA SURFACE:",
              sst_value,
              "°C"
          )


          # ------------------------------------------------------------
          # DAY / NIGHT
          #
          # For the spherical Earth, the solar terminator divides the
          # illuminated and dark hemispheres into equal areas. Therefore
          # the global area split is exactly 50% / 50%. This is not a
          # placeholder or a time-independent observation; it is the
          # geometric definition of global illuminated/dark area.
          # ------------------------------------------------------------

          day_percent = 50.0
          night_percent = 50.0

          day_night_value = (
              f"{day_percent:.1f}% DAY / "
              f"{night_percent:.1f}% NIGHT"
          )


          # ------------------------------------------------------------
          # CLOUD COVER
          #
          # No globally averaged, near-real-time cloud fraction is
          # available in the current public data stack used by this
          # workflow. Do not substitute a METAR station average for a
          # global value. The frontend will therefore show NO DATA.
          # ------------------------------------------------------------

          cloud_cover_value = None


          # ------------------------------------------------------------
          # AURORA
          #
          # NOAA SWPC OVATION latest global aurora grid. The displayed
          # value is the maximum aurora probability/intensity value in
          # the current 1-degree global grid. This is a model output,
          # not a claim that aurora is visible from a particular place.
          # ------------------------------------------------------------

          aurora_url = (
              "https://services.swpc.noaa.gov/"
              "json/ovation_aurora_latest.json"
          )

          aurora_raw = fetch_json(
              aurora_url,
              timeout=120
          )

          aurora_coords = aurora_raw.get(
              "coordinates"
          )

          if not isinstance(
              aurora_coords,
              list
          ) or not aurora_coords:
              raise RuntimeError(
                  "NOAA OVATION aurora data is empty."
              )

          aurora_values = []

          for point in aurora_coords:
              if not isinstance(point, list) or len(point) < 3:
                  continue

              value = number(
                  point[2]
              )

              if value is None:
                  continue

              aurora_values.append(
                  value
              )

          if not aurora_values:
              raise RuntimeError(
                  "NOAA OVATION aurora data has no valid values."
              )

          aurora_max = round(
              max(aurora_values),
              1
          )

          aurora_observation_time = clean(
              aurora_raw.get(
                  "Observation Time"
              )
          )

          aurora_forecast_time = clean(
              aurora_raw.get(
                  "Forecast Time"
              )
          )

          print(
              "AURORA MAX:",
              aurora_max,
              "%"
          )


          # ------------------------------------------------------------
          # GLOBAL PULSE OBJECT
          # ------------------------------------------------------------

          global_pulse = {

              "population": {
                  "value":
                      world_population,

                  "display":
                      f"{world_population:,}",

                  "source":
                      "U.S. Census Bureau"
              },


              "co2": {
                  "value":
                      round(
                          co2_value,
                          2
                      ),

                  "display":
                      f"{co2_value:.2f} ppm",

                  "source":
                      "NOAA Global Monitoring Laboratory - Global Monthly Mean CO2",

                  "date":
                      (
                          f"{latest_co2['year']:04d}-"
                          f"{latest_co2['month']:02d}-"
                          f"{latest_co2['day']:02d}"
                      )
              },


              "seaSurface": {
                  "value":
                      sst_value,

                  "display":
                      f"{sst_value:.2f} °C",

                  "source":
                      "NOAA ACSPO Global SST (area-weighted sample)",

                  "dataset":
                      "ACSPO_LEO_L3S_nrt"
              },


              "dayNight": {
                  "value":
                      0.5,

                  "display":
                      day_night_value,

                  "source":
                      "Solar geometry (global area split)"
              },


              "cloudCover": {
                  "value":
                      None,

                  "display":
                      "NO DATA",

                  "source":
                      "No validated global near-real-time cloud fraction source"
              },


              "geomagnetic": {
                  "value":
                      round(
                          geomagnetic_kp,
                          1
                      ),

                  "display":
                      f"Kp {geomagnetic_kp:.1f}",

                  "source":
                      "NOAA SWPC",

                  "time":
                      geomagnetic_time
              },

          }


          # ============================================================
          # NOAA SPACE WEATHER
          # ============================================================

          solar_speed_url = (
              "https://services.swpc.noaa.gov/"
              "products/summary/"
              "solar-wind-speed.json"
          )

          magnetic_url = (
              "https://services.swpc.noaa.gov/"
              "products/summary/"
              "solar-wind-mag-field.json"
          )

          flux_url = (
              "https://services.swpc.noaa.gov/"
              "products/summary/"
              "10cm-flux.json"
          )


          solar_speed_raw = fetch_json(
              solar_speed_url
          )

          magnetic_raw = fetch_json(
              magnetic_url
          )

          flux_raw = fetch_json(
              flux_url
          )


          def latest_row(data):
              row, timestamp = latest_timestamped_row(
                  data,
                  ["time_tag", "time"]
              )

              if row is None:
                  return {}, None

              return row, timestamp


          solar_speed, solar_speed_dt = latest_row(
              solar_speed_raw
          )

          magnetic, magnetic_dt = latest_row(
              magnetic_raw
          )

          flux, flux_dt = latest_row(
              flux_raw
          )

          if solar_speed is None or solar_speed_dt is None:
              raise RuntimeError(
                  "NOAA solar-wind-speed data has no valid timestamped row."
              )

          if magnetic is None or magnetic_dt is None:
              raise RuntimeError(
                  "NOAA solar-wind-mag-field data has no valid timestamped row."
              )

          if flux is None or flux_dt is None:
              raise RuntimeError(
                  "NOAA 10cm flux data has no valid timestamped row."
              )


          solar_wind = {
              "time": clean(
                  val(
                      solar_speed,
                      "time_tag",
                      "time"
                  )
              ),
              "speed": number(
                  val(
                      solar_speed,
                      "proton_speed",
                      "speed"
                  )
              )
          }


          magnetic_field = {
              "time": clean(
                  val(
                      magnetic,
                      "time_tag",
                      "time"
                  )
              ),
              "bt": number(
                  val(
                      magnetic,
                      "bt",
                      "Bt"
                  )
              ),
              "bz": number(
                  val(
                      magnetic,
                      "bz_gsm",
                      "bz",
                      "Bz"
                  )
              )
          }


          flux_data = {
              "time": clean(
                  val(
                      flux,
                      "time_tag",
                      "time"
                  )
              ),
              "flux": number(
                  val(
                      flux,
                      "flux",
                      "f10_7"
                  )
              )
          }


          for timestamp, name, limit in (
              (solar_speed_dt, "Solar Wind", timedelta(hours=3)),
              (magnetic_dt, "Magnetic Field", timedelta(hours=3)),
              (flux_dt, "10cm Flux", timedelta(days=7))
          ):
              if now_utc - timestamp > limit:
                  raise RuntimeError(
                      name + " data is too old."
                  )


          # ============================================================
          # MEDIA SIGNAL IMAGES
          # ============================================================

          os.makedirs(
              "world-media",
              exist_ok=True
          )


          # ------------------------------------------------------------
          # MEDIA SIGNAL ①
          # Wikimedia Commons
          # ------------------------------------------------------------

          commons_api = (
              "https://commons.wikimedia.org/"
              "w/api.php"
          )


          commons_categories = [
              "Nature",
              "Animals",
              "Birds",
              "Plants",
              "Landscapes",
              "Forests",
              "Mountains",
              "Rivers",
              "Lakes",
              "Water",
              "Beaches",
              "Gardens",
              "Architecture",
