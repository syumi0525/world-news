                  )

              time.sleep(2)


          # If Commons is rate-limited, preserve the previous MEDIA SIGNAL ①
          # only when its stored license is already strictly CC0/Public Domain.
          if not media1_info:
              previous_path = "world-data.json"

              try:
                  with open(
