                          "url": clean(
                              previous_media1.get("page")
                          ),
                          "imageUrl": ""
                      }

                      print(
                          "MEDIA SIGNAL ①: preserving previous verified CC0/Public Domain image."
                      )
              except Exception as e:
                  print(
                      "Previous MEDIA SIGNAL ① unavailable:",
                      str(e)
                  )


          if not media1_info:
              raise RuntimeError(
                  "No verified CC0/Public Domain MEDIA SIGNAL ① image is available."
              )


          media1_path = (
              "world-media/media1.jpg"
          )


          if media1_info.get("imageUrl"):
              download(
                  media1_info["imageUrl"],
                  media1_path
              )


          # ------------------------------------------------------------
          # MEDIA SIGNAL ②
          # NOAA
          # ------------------------------------------------------------

          noaa_sources = [
              {
                  "name":
                      "NOAA GOES-19 CONUS",
                  "source":
                      "NOAA GOES",
                  "url":
                      "https://cdn.star.nesdis.noaa.gov/"
                      "GOES19/ABI/CONUS/"
