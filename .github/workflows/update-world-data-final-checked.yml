              },


              "mediaSignal1": {

                  "source":
                      "Wikimedia Commons",

                  "title":
                      media1_info["title"],

                  "artist":
                      media1_info["artist"],

                  "license":
                      media1_info["license"],

                  "rights":
                      "CC0/Public Domain only; selected automatically for commercial-use safety.",

