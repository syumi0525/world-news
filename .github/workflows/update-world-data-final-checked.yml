                          "ImageDescription",
                          {}
                      ).get("value")
                  )

                  if any(
                      word in description.lower()
                      for word in blocked_words
                  ):
                      continue

                  image_url_direct = clean(
                      info.get("thumburl")
                  ) or clean(
                      info.get("url")
                  )

                  if not image_url_direct:
                      continue

                  artist = clean(
                      metadata.get(
                          "Artist",
                          {}
                      ).get("value")
                  )

                  page_url = (
                      "https://commons.wikimedia.org/wiki/"
                      + urllib.parse.quote(
                          page_title.replace(" ", "_"),
                          safe=":/"
                      )
                  )

                  candidates.append({
