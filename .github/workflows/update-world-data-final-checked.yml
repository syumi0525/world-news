          import tempfile

          with tempfile.NamedTemporaryFile(
              mode="wb",
              suffix=".grib2",
              delete=False
          ) as grib_file:
              grib_file.write(cloud_grib)
              grib_path = grib_file.name

          gid = None
          try:
              with open(grib_path, "rb") as grib_file:
                  gid = eccodes.codes_grib_new_from_file(grib_file)
          finally:
              try:
                  os.unlink(grib_path)
              except OSError:
                  pass

          if gid is None:
              raise RuntimeError(
                  "NOAA/NCEP GFS cloud-cover response contained no GRIB message."
              )

          try:
              short_name = eccodes.codes_get(gid, "shortName")
              if str(short_name).upper() != "TCDC":
                  raise RuntimeError(
                      "NOAA/NCEP GFS response is not the TCDC field: "
                      + str(short_name)
                  )

              values = eccodes.codes_get_array(gid, "values")
              ni = int(eccodes.codes_get(gid, "Ni"))
              nj = int(eccodes.codes_get(gid, "Nj"))
              lat_first = float(
                  eccodes.codes_get(
                      gid, "latitudeOfFirstGridPointInDegrees"
                  )
              )
              lat_last = float(
                  eccodes.codes_get(
                      gid, "latitudeOfLastGridPointInDegrees"
                  )
              )
              try:
                  missing = float(
                      eccodes.codes_get(gid, "missingValue")
                  )
              except Exception:
