          random_place = data.get("randomPlace")
          global_pulse = data.get("globalPulse")
          space = data.get("space")
          images = data.get("images")
          media1 = data.get("mediaSignal1")
          media2 = data.get("mediaSignal2")
          generated_dt = parse_dt(data.get("generatedAt"))

          require_dict(atmosphere, "Atmosphere data")
          require_dict(random_place, "Random Place data")
          require_dict(global_pulse, "GLOBAL PULSE data")
          require_dict(space, "Space Weather data")
          require_dict(images, "Images data")
          require_dict(media1, "MEDIA SIGNAL ① metadata")
          require_dict(media2, "MEDIA SIGNAL ② metadata")

          for obj, name in (
              (atmosphere, "Atmosphere"),
              (random_place, "Random Place")
          ):
              if obj.get("lat") is None or obj.get("lon") is None:
                  raise RuntimeError(
                      name + " coordinates are missing."
                  )
              require_finite(obj.get("lat"), name + " latitude")
              require_finite(obj.get("lon"), name + " longitude")

              obs_dt = parse_dt(
                  obj.get("observationTime")
              )
              if obs_dt is None:
                  raise RuntimeError(
                      name + " observation timestamp is invalid."
                  )
              if now - obs_dt > timedelta(hours=2):
                  raise RuntimeError(
                      name + " observation is too old."
                  )

          required_global_pulse = [
              "population",
              "co2",
              "seaSurface",
              "geomagnetic",
              "dayNight",
              "cloudCover"
          ]

          for key in required_global_pulse:
              item = global_pulse.get(key)
              require_dict(item, "GLOBAL PULSE " + key)
              if not item.get("display"):
                  raise RuntimeError(
                      "GLOBAL PULSE display is missing: " + key
                  )

          require_finite(
              global_pulse["population"]["value"],
              "WORLD POPULATION"
          )
          require_finite(
              global_pulse["co2"]["value"],
              "GLOBAL CO2"
          )
          require_finite(
              global_pulse["geomagnetic"]["value"],
              "GEOMAGNETIC"
          )
          require_finite(
              global_pulse["seaSurface"]["value"],
              "SEA SURFACE"
          )
          require_finite(
              global_pulse["dayNight"]["value"],
              "DAY / NIGHT"
          )
          require_finite(
              global_pulse["cloudCover"]["value"],
              "CLOUD COVER"
          )
          if not (
              0.0 <= global_pulse["cloudCover"]["value"] <= 100.0
          ):
              raise RuntimeError(
                  "CLOUD COVER is outside the valid 0..100% range."
              )
          cloud_time = parse_dt(
              global_pulse["cloudCover"].get("time")
          )
          if cloud_time is None or now - cloud_time > timedelta(days=3):
              raise RuntimeError(
                  "CLOUD COVER timestamp is missing or too old."
              )

          aurora = space.get("aurora")
          require_dict(aurora, "Aurora")
          require_finite(
              aurora.get("value"),
              "AURORA"
          )
          if not aurora.get("display"):
              raise RuntimeError(
                  "Aurora display is missing."
              )
          co2_date = parse_dt(
              global_pulse["co2"].get("date")
          )
          if co2_date is None or now - co2_date > timedelta(days=120):
              raise RuntimeError(
                  "GLOBAL CO2 date is missing or too old."
              )

          geomagnetic_time = parse_dt(
              global_pulse["geomagnetic"].get("time")
          )
          if geomagnetic_time is None or now - geomagnetic_time > timedelta(hours=12):
              raise RuntimeError(
                  "GEOMAGNETIC timestamp is missing or too old."
              )

          solar_wind = space.get("solarWind")
          magnetic = space.get("magneticField")
          kp = space.get("kp")
          flux = space.get("flux10cm")

          require_dict(solar_wind, "Solar Wind")
          require_dict(magnetic, "Magnetic Field")
          require_dict(kp, "Kp")
          require_dict(flux, "10cm Flux")

          require_finite(
              solar_wind.get("speed"),
              "Solar Wind speed"
          )
          require_finite(
              magnetic.get("bt"),
              "Magnetic Bt"
          )
          require_finite(
              magnetic.get("bz"),
              "Magnetic Bz"
          )
          require_finite(
              kp.get("kp"),
              "Kp"
          )
          require_finite(
              flux.get("flux"),
              "10cm Flux"
          )

          for obj, name, limit in (
              (solar_wind, "Solar Wind", timedelta(hours=3)),
              (magnetic, "Magnetic Field", timedelta(hours=3)),
              (kp, "Kp", timedelta(hours=12)),
              (flux, "10cm Flux", timedelta(days=7))
          ):
              dt = parse_dt(obj.get("time"))
              if dt is None or now - dt > limit:
                  raise RuntimeError(
                      name + " timestamp is missing or too old."
                  )

          if not images.get("media1") or not images.get("media2"):
              raise RuntimeError(
                  "MEDIA SIGNAL image paths are missing."
              )

          for path in (
              "world-media/media1.jpg",
              "world-media/media2.jpg"
          ):
              if not os.path.exists(path) or os.path.getsize(path) < 1000:
                  raise RuntimeError(
                      "Image file is missing or too small: " + path
                  )

          if not media1.get("license"):
              raise RuntimeError(
                  "MEDIA SIGNAL ① license metadata is missing."
              )

          license_lower = str(
              media1["license"]
          ).lower()

          accepted_media1_licenses = {
              "cc0",
              "cc0 1.0",
              "cc0 1.0 universal public domain dedication",
              "public domain",
              "public domain mark"
          }

          if not (
              license_lower in accepted_media1_licenses
              or license_lower.startswith("public domain ")
          ):
              raise RuntimeError(
                  "MEDIA SIGNAL ① license is not in the strict CC0/Public Domain-only set."
              )
          if generated_dt is None:
              raise RuntimeError(
                  "generatedAt is invalid."
              )

          if generated_dt > now + timedelta(minutes=5):
              raise RuntimeError(
                  "generatedAt is in the future."
              )

          print("================================")
          print("Verification OK")
          print("Atmosphere:", atmosphere.get("name"))
          print("Random Place:", random_place.get("name"))
          print("Coordinates:", random_place.get("lat"), random_place.get("lon"))
          print("WORLD POPULATION:", global_pulse["population"]["display"])
          print("CO2:", global_pulse["co2"]["display"])
          print("SEA SURFACE:", global_pulse["seaSurface"]["display"])
          print("DAY / NIGHT:", global_pulse["dayNight"]["display"])
          print("CLOUD COVER:", global_pulse["cloudCover"]["display"])
          print("GEOMAGNETIC:", global_pulse["geomagnetic"]["display"])
          print("MEDIA SIGNAL ①:", media1.get("title"))
          print("MEDIA SIGNAL ① License:", media1.get("license"))
          print("MEDIA SIGNAL ②:", media2.get("name"))
          print("MEDIA SIGNAL ② Source:", media2.get("source"))
          print("Solar Wind:", solar_wind.get("speed"))
          print("Magnetic Bt:", magnetic.get("bt"))
          print("Kp:", kp.get("kp"))
          print("10cm Flux:", flux.get("flux"))
          print("================================")
          PY


      - name: Commit updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add world-data.json world-media/

          if git diff --cached --quiet; then
            echo "No changes."
          else
            git commit -m "Update WORLD NEWS data"
            git push
          fi
