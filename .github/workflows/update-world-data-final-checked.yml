name: Update WORLD NEWS data

on:
  workflow_dispatch:
  schedule:
    - cron: "*/10 * * * *"

permissions:
  contents: write

jobs:
  update-world-data:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install GRIB reader
        run: |
          python -m pip install --disable-pip-version-check --no-input --quiet eccodes

      - name: Update WORLD NEWS
        run: |
          python - <<'PY'
          import csv
          import gzip
          import io
          import json
          import math
          import os
          import random
          import time
          import re
          import urllib.parse
          import urllib.request
          import urllib.error
          from datetime import datetime, timezone, timedelta


          UA = "WORLD-NEWS/1.0"


          # ============================================================
          # COMMON FUNCTIONS
          # ============================================================

          def fetch_json(url, timeout=60, attempts=5):
              last_error = None

              for attempt in range(attempts):
                  req = urllib.request.Request(
                      url,
                      headers={
                          "User-Agent": UA,
                          "Accept": "application/json",
                      },
                  )

                  try:
                      with urllib.request.urlopen(
                          req,
                          timeout=timeout
                      ) as response:
                          return json.loads(
                              response.read().decode("utf-8")
                          )

                  except urllib.error.HTTPError as exc:
                      last_error = exc

                      retryable_codes = {429, 502, 503, 504}
                      if exc.code not in retryable_codes or attempt >= attempts - 1:
                          raise

                      retry_after = exc.headers.get("Retry-After")

                      try:
                          delay = int(retry_after) if retry_after else 2 ** attempt
                      except (TypeError, ValueError):
                          delay = 2 ** attempt

                      delay = max(2, min(delay, 60))

                      print(
                          f"HTTP {exc.code} for {url}; retrying in {delay}s "
                          f"({attempt + 1}/{attempts})"
                      )

                      time.sleep(delay)

              raise last_error


          def fetch_bytes(url, timeout=60, attempts=5):
              last_error = None

              for attempt in range(attempts):
                  req = urllib.request.Request(
                      url,
                      headers={
                          "User-Agent": UA
                      },
                  )

                  try:
                      with urllib.request.urlopen(
                          req,
                          timeout=timeout
                      ) as response:
                          return response.read()
                  except urllib.error.HTTPError as exc:
                      last_error = exc

                      retryable_codes = {429, 502, 503, 504}
                      if exc.code not in retryable_codes or attempt >= attempts - 1:
                          raise

                      retry_after = exc.headers.get("Retry-After")

                      try:
                          delay = int(retry_after) if retry_after else 2 ** attempt
                      except (TypeError, ValueError):
                          delay = 2 ** attempt

                      delay = max(2, min(delay, 60))

                      print(
                          f"HTTP {exc.code} for {url}; retrying in {delay}s "
                          f"({attempt + 1}/{attempts})"
                      )

                      time.sleep(delay)

                  except (urllib.error.URLError, TimeoutError) as exc:
                      last_error = exc

                      if attempt >= attempts - 1:
                          raise

                      delay = max(2, min(2 ** attempt, 60))
                      print(
                          f"NETWORK ERROR for {url}; retrying in {delay}s "
                          f"({attempt + 1}/{attempts})"
                      )
                      time.sleep(delay)

              raise last_error


          def download(url, path):
              data = fetch_bytes(url)

              if len(data) < 1000:
                  raise RuntimeError(
                      "Downloaded image is too small."
                  )

              with open(path, "wb") as f:
                  f.write(data)


          def clean(value, default=""):
              if value is None:
                  return default

              return str(value).strip()


          def number(value):
              try:
                  if value is None:
                      return None

                  text = str(value).strip()

                  if not text:
                      return None

                  value = float(text)

                  if not math.isfinite(value):
                      return None

                  return value

              except Exception:
                  return None


          def find_value(row, names):
              for name in names:
                  if name in row:
                      value = row[name]

                      if (
                          value is not None
                          and str(value).strip() != ""
                      ):
                          return value

              return None


          def parse_datetime(value):
              if value is None:
                  return None

              if isinstance(value, (int, float)):
                  try:
                      return datetime.fromtimestamp(
                          float(value),
                          tz=timezone.utc
                      )
                  except Exception:
                      return None

              text = str(value).strip()
              if not text:
                  return None

              if text.endswith("Z"):
                  text = text[:-1] + "+00:00"

              try:
                  dt = datetime.fromisoformat(text)
                  if dt.tzinfo is None:
                      dt = dt.replace(tzinfo=timezone.utc)
                  return dt.astimezone(timezone.utc)
              except Exception:
                  pass

              for fmt in (
                  "%Y-%m-%d %H:%M:%S",
                  "%Y-%m-%d %H:%M",
                  "%Y%m%d%H%M%S",
                  "%Y%m%d%H%M",
              ):
                  try:
                      return datetime.strptime(
                          text,
                          fmt
                      ).replace(tzinfo=timezone.utc)
                  except Exception:
                      continue

              return None


          def latest_timestamped_row(data, time_keys):
              rows = []

              if isinstance(data, dict):
                  rows = [data]
              elif isinstance(data, list):
                  rows = [
                      row
                      for row in data
                      if isinstance(row, dict)
                  ]

              best_row = None
              best_time = None

              for row in rows:
                  timestamp = None
                  for key in time_keys:
                      if key in row and row[key] not in (None, ""):
                          timestamp = parse_datetime(row[key])
                          if timestamp is not None:
                              break

                  if timestamp is None:
                      continue

                  if best_time is None or timestamp > best_time:
                      best_time = timestamp
                      best_row = row

              return best_row, best_time


          # ============================================================
          # METAR
          # ============================================================

          def make_weather(row):
              lat = number(
                  find_value(
                      row,
                      [
                          "latitude",
                          "lat"
                      ]
                  )
              )

              lon = number(
                  find_value(
                      row,
                      [
                          "longitude",
                          "lon"
                      ]
                  )
              )

              station = clean(
                  find_value(
                      row,
                      [
                          "station_id",
                          "icaoId",
                          "station"
                      ]
                  )
              )

              name = clean(
                  find_value(
                      row,
                      [
                          "station_name",
                          "name"
                      ]
                  )
              )

              weather = clean(
                  find_value(
                      row,
                      [
                          "wx_string",
                          "wxString",
                          "weather"
                      ]
                  ),
                  "No coded weather"
              )

              temperature = number(
                  find_value(
                      row,
                      [
                          "temp_c",
                          "temp",
                          "temperature"
                      ]
                  )
              )

              dewpoint = number(
                  find_value(
                      row,
                      [
                          "dewpoint_c",
                          "dewp",
                          "dewpoint"
                      ]
                  )
              )

              wind_speed = number(
                  find_value(
                      row,
                      [
                          "wind_speed_kt",
                          "wspd",
                          "windSpeed"
                      ]
                  )
              )

              wind_direction = number(
                  find_value(
                      row,
                      [
                          "wind_dir_degrees",
                          "wdir",
                          "windDirection"
                      ]
                  )
              )

              visibility = clean(
                  find_value(
                      row,
                      [
                          "visibility_statute_mi",
                          "visib",
                          "visibility"
                      ]
                  ),
                  "N/A"
              )

              flight_category = clean(
                  find_value(
                      row,
                      [
                          "flight_category",
                          "fltCat",
                          "flightCategory"
                      ]
                  ),
                  "N/A"
              )

              observation_time = clean(
                  find_value(
                      row,
                      [
                          "observation_time",
                          "obsTime",
                          "observationTime"
                      ]
                  )
              )

              raw = clean(
                  find_value(
                      row,
                      [
                          "raw_text",
                          "rawOb",
                          "raw"
                      ]
                  )

              )

              observation_dt = parse_datetime(
                  observation_time
              )

              return {
                  "name": name or station or "Unknown",
                  "station": station,
                  "lat": lat,
                  "lon": lon,
                  "weather": weather,
                  "temperature": temperature,
                  "dewpoint": dewpoint,
                  "windSpeed": wind_speed,
                  "windDirection": wind_direction,
                  "visibility": visibility,
                  "flightCategory": flight_category,
                  "observationTime": observation_time,
                  "observationTimestamp": (
                      observation_dt.isoformat()
                      if observation_dt is not None
                      else ""
                  ),
                  "raw": raw
              }


          metar_cache_url = (
              "https://aviationweather.gov/"
              "data/cache/metars.cache.csv.gz"
          )

          print("")
          print("================================")
          print("FETCHING METAR CACHE")
          print("================================")

          compressed = fetch_bytes(
              metar_cache_url
          )

          csv_bytes = gzip.decompress(
              compressed
          )

          csv_text = csv_bytes.decode(
              "utf-8-sig",
              errors="replace"
          )

          reader = csv.DictReader(
              io.StringIO(csv_text)
          )

          now_utc = datetime.now(
              timezone.utc
          )

          valid_rows = []

          for row in reader:
              if not row:
                  continue

              weather = make_weather(
                  row
              )

              if not weather["station"]:
                  continue

              if weather["lat"] is None or weather["lon"] is None:
                  continue

              if not (-90 <= weather["lat"] <= 90):
                  continue

              if not (-180 <= weather["lon"] <= 180):
                  continue

              observation_dt = parse_datetime(
                  weather.get("observationTime")
              )

              if observation_dt is None:
                  continue

              age = now_utc - observation_dt

              if age < timedelta(minutes=-10):
                  continue

              if age > timedelta(hours=2):
                  continue

              valid_rows.append(
                  weather
              )

          print(
              "Valid fresh METAR stations:",
              len(valid_rows)
          )

          if len(valid_rows) < 20:
              raise RuntimeError(
                  "Not enough fresh METAR stations."
              )

          random.shuffle(
              valid_rows
          )

          atmosphere_data = valid_rows[0]
          random_place_data = valid_rows[1]


          # ============================================================
          # GLOBAL PULSE
          # ============================================================

          print("")
          print("================================")
          print("FETCHING GLOBAL PULSE")
          print("================================")


          # ------------------------------------------------------------
          # 1. WORLD POPULATION
          #
          # U.S. Census Bureau Population Clock
          # ------------------------------------------------------------

          population_url = (
              "https://www.census.gov/"
              "popclock/data/population.php"
          )


          population_raw = fetch_json(
              population_url
          )


          world_population = (
              population_raw
              .get("world", {})
              .get("population")
          )


          if world_population is None:
              raise RuntimeError(
                  "World population data is missing."
              )


          world_population = int(
              float(world_population)
          )


          print(
              "WORLD POPULATION:",
              world_population
          )


          # ------------------------------------------------------------
          # 2. CO2
          #
          # NOAA Global Monitoring Laboratory
          # Globally averaged marine surface monthly mean CO2.
          # ------------------------------------------------------------

          co2_url = (
              "https://gml.noaa.gov/"
              "webdata/ccgg/trends/co2/"
              "co2_mm_gl.csv"
          )

          print(
              "Fetching global CO2:",
              co2_url
          )

          co2_text = fetch_bytes(
              co2_url
          ).decode(
              "utf-8",
              errors="replace"
          )

          latest_co2 = None
          latest_co2_date = None

          for line in co2_text.splitlines():
              line = line.strip()

              if not line or line.startswith("#"):
                  continue

              parts = [
                  p.strip()
                  for p in line.split(",")
              ]

              if len(parts) < 4:
                  continue

              try:
                  year = int(parts[0])
                  month = int(parts[1])
                  value = float(parts[3])
                  row_date = datetime(
                      year,
                      month,
                      1,
                      tzinfo=timezone.utc
                  )
              except Exception:
                  continue

              if value <= 0:
                  continue

              if latest_co2_date is None or row_date > latest_co2_date:
                  latest_co2_date = row_date
                  latest_co2 = {
                      "year": year,
                      "month": month,
                      "day": 1,
                      "value": value
                  }

          if not latest_co2:
              raise RuntimeError(
                  "NOAA global CO2 data could not be read."
              )

          if latest_co2_date > now_utc + timedelta(days=31):
              raise RuntimeError(
                  "NOAA global CO2 date is invalid."
              )

          if now_utc - latest_co2_date > timedelta(days=120):
              raise RuntimeError(
                  "NOAA global CO2 data is too old."
              )

          co2_value = latest_co2["value"]

          print(
              "GLOBAL CO2:",
              co2_value,
              "ppm",
              latest_co2["year"],
              latest_co2["month"]
          )


          # ------------------------------------------------------------
          # 4. GEOMAGNETIC
          #
          # NOAA SWPC planetary K-index.
          # ------------------------------------------------------------

          kp_url = (
              "https://services.swpc.noaa.gov/"
              "products/"
              "noaa-planetary-k-index.json"
          )


          kp_raw = fetch_json(
              kp_url
          )


          kp_rows = (
              kp_raw
              if isinstance(
                  kp_raw,
                  list
              )
              else [kp_raw]
          )


          kp_rows = [
              row
              for row in kp_rows
              if isinstance(
                  row,
                  dict
              )
          ]


          if not kp_rows:
              raise RuntimeError(
                  "NOAA Kp data is empty."
              )


          kp_latest, kp_latest_dt = latest_timestamped_row(
              kp_rows,
              ["time_tag", "time"]
          )

          if kp_latest is None or kp_latest_dt is None:
              raise RuntimeError(
                  "NOAA Kp data has no valid timestamped row."
              )

          if now_utc - kp_latest_dt > timedelta(hours=12):
              raise RuntimeError(
                  "NOAA Kp data is too old."
              )


          geomagnetic_kp = number(
              kp_latest.get("Kp")
          )


          if geomagnetic_kp is None:
              geomagnetic_kp = number(
                  kp_latest.get("kp")
              )


          if geomagnetic_kp is None:
              raise RuntimeError(
                  "NOAA Kp value is missing."
              )


          def val(obj, *keys):
              for key in keys:
                  if (
                      isinstance(obj, dict)
                      and
                      key in obj
                  ):
                      return obj[key]

              return None


          geomagnetic_time = clean(
              val(
                  kp_latest,
                  "time_tag",
                  "time"
              )
          )


          print(
              "GEOMAGNETIC Kp:",
              geomagnetic_kp
          )


          # ------------------------------------------------------------
          # SEA SURFACE TEMPERATURE
          #
          # NOAA ACSPO daily global SST (0.02 degree grid).
          # We request a coarse, latitude-weighted global sample from the
          # latest available day. Land/fill values are excluded.
          # ------------------------------------------------------------

          sst_url = (
              "https://oceanwatch.pifsc.noaa.gov/"
              "erddap/griddap/ACSPO_LEO_L3S_nrt.csv?"
              "sea_surface_temperature"
              "[last][0:500:8999][0:500:17999]"
          )

          sst_bytes = fetch_bytes(
              sst_url,
              timeout=120
          )

          sst_text = sst_bytes.decode(
              "utf-8",
              errors="replace"
          )

          sst_reader = csv.reader(
              io.StringIO(sst_text)
          )

          sst_rows = list(
              sst_reader
          )

          if len(sst_rows) < 2:
              raise RuntimeError(
                  "NOAA ACSPO SST returned no data."
              )

          sst_header = [
              str(x).strip().lower()
              for x in sst_rows[0]
          ]

          lat_index = None
          sst_index = None

          for i, name in enumerate(
              sst_header
          ):
              if name == "latitude":
                  lat_index = i
              if name == "sea_surface_temperature":
                  sst_index = i

          if lat_index is None or sst_index is None:
              raise RuntimeError(
                  "NOAA ACSPO SST response has unexpected columns."
              )

          sst_weighted_sum = 0.0
          sst_weight_sum = 0.0

          for row in sst_rows[1:]:
              if len(row) <= max(
                  lat_index,
                  sst_index
              ):
                  continue

              lat = number(
                  row[lat_index]
              )
              sst = number(
                  row[sst_index]
              )

              if lat is None or sst is None:
                  continue

              if sst < -2 or sst > 40:
                  continue

              weight = math.cos(
                  math.radians(lat)
              )

              if weight <= 0:
                  continue

              sst_weighted_sum += sst * weight
              sst_weight_sum += weight

          if sst_weight_sum <= 0:
              raise RuntimeError(
                  "NOAA ACSPO SST contained no valid global samples."
              )

          sst_value = (
              sst_weighted_sum
              / sst_weight_sum
          )

          sst_value = round(
              sst_value,
              2
          )

          print(
              "SEA SURFACE:",
              sst_value,
              "°C"
          )


          # ------------------------------------------------------------
          # DAY / NIGHT
          #
          # Calculate the global illuminated/dark surface split from the
          # current UTC time and solar declination. The calculation uses
          # latitude bands weighted by surface area; it does not contain
          # a hard-coded 50/50 value.
          # ------------------------------------------------------------

          def solar_declination_deg(dt):
              # NOAA-style fractional-year approximation.
              day_of_year = dt.timetuple().tm_yday
              hour = dt.hour + dt.minute / 60.0 + dt.second / 3600.0
              gamma = (
                  2.0 * math.pi / 365.0
                  * (day_of_year - 1 + (hour - 12.0) / 24.0)
              )
              declination = (
                  0.006918
                  - 0.399912 * math.cos(gamma)
                  + 0.070257 * math.sin(gamma)
                  - 0.006758 * math.cos(2 * gamma)
                  + 0.000907 * math.sin(2 * gamma)
                  - 0.002697 * math.cos(3 * gamma)
                  + 0.00148 * math.sin(3 * gamma)
              )
              return math.degrees(declination)


          declination_rad = math.radians(
              solar_declination_deg(now_utc)
          )

          day_area = 0.0
          night_area = 0.0

          for lat_deg in range(-899, 900, 2):
              lat_rad = math.radians(lat_deg / 10.0)
              cos_lat = math.cos(lat_rad)

              if cos_lat <= 0.0:
                  continue

              x = -math.tan(lat_rad) * math.tan(declination_rad)

              if x <= -1.0:
                  daylight_fraction = 1.0
              elif x >= 1.0:
                  daylight_fraction = 0.0
              else:
                  hour_angle = math.acos(x)
                  daylight_fraction = hour_angle / math.pi

              band_weight = cos_lat
              day_area += daylight_fraction * band_weight
              night_area += (1.0 - daylight_fraction) * band_weight

          total_area = day_area + night_area

          if total_area <= 0.0:
              raise RuntimeError(
                  "Solar day/night calculation produced no valid area."
              )

          day_percent = round(
              day_area / total_area * 100.0,
              1
          )
          night_percent = round(
              night_area / total_area * 100.0,
              1
          )

          day_night_value = (
              f"{day_percent:.1f}% DAY / "
              f"{night_percent:.1f}% NIGHT"
          )


          # ------------------------------------------------------------
          # CLOUD COVER
          #
          # NOAA/NCEP GFS global Total Cloud Cover (TCDC).
          # This is the current operational global model field, downloaded
          # from NOAA/NCEP NOMADS at 1-degree resolution.  The value shown
          # here is the cosine(latitude)-weighted global mean of the actual
          # TCDC field from the newest available analysis cycle.
          # ------------------------------------------------------------

          import eccodes

          # NOMADS currently exposes the GFS 1-degree archive at 00Z, 06Z
          # and 12Z on this filter endpoint. Build only those cycles so we
          # do not waste requests on an unsupported 18Z cycle.
          def previous_gfs_cycles(base_dt, count=8):
              cycles = []
              cursor = base_dt.replace(minute=0, second=0, microsecond=0)
              cursor -= timedelta(hours=cursor.hour % 6)

              while len(cycles) < count:
                  if cursor.hour in (0, 6, 12):
                      cycles.append(cursor)
                  cursor -= timedelta(hours=6)

              return cycles

          def fetch_gfs_cloud(url):
              # GFS publication is asynchronous. A not-yet-published cycle
              # must cause us to try the previous cycle, not fail the whole
              # workflow. NOMADS may answer 404/500/502/503/504 while a file
              # is unavailable.
              req = urllib.request.Request(
                  url,
                  headers={
                      "User-Agent": UA,
                      "Accept": "application/octet-stream"
                  },
              )

              try:
                  with urllib.request.urlopen(req, timeout=120) as response:
                      return response.read()
              except urllib.error.HTTPError as exc:
                  if exc.code in {404, 500, 502, 503, 504}:
                      print(
                          "GFS cycle unavailable (HTTP",
                          exc.code,
                          ")"
                      )
                      return None
              except (urllib.error.URLError, TimeoutError) as exc:
                  print("GFS network error:", exc)
                  return None

              return None

          cloud_grib = None
          cloud_cycle = None
          cloud_url = None

          # The workflow runs every 10 minutes, while GFS 1-degree is
          # published every 6 hours. Reuse the already-stored real GFS value
          # when it is still the newest cycle, instead of repeatedly hitting
          # NOMADS for the same field.
          existing_cloud = None
          existing_path = os.path.join(
              os.getcwd(), "world-data.json"
          )
          try:
              with open(existing_path, "r", encoding="utf-8") as existing_file:
                  existing_json = json.load(existing_file)
              existing_cloud = existing_json.get("globalPulse", {}).get(
                  "cloudCover"
              )
          except (OSError, ValueError, TypeError):
              existing_cloud = None

          candidate_cycles = previous_gfs_cycles(now_utc, count=8)
          newest_cycle = candidate_cycles[0]

          if isinstance(existing_cloud, dict):
              existing_time = existing_cloud.get("time")
              existing_value = existing_cloud.get("value")
              newest_time = newest_cycle.strftime("%Y-%m-%dT%H:%M:%SZ")
              if (
                  existing_time == newest_time
                  and isinstance(existing_value, (int, float))
                  and math.isfinite(float(existing_value))
                  and 0.0 <= float(existing_value) <= 100.0
              ):
                  cloud_cycle = newest_cycle
                  latest_cloud_time = existing_time
                  cloud_cover_value = round(float(existing_value), 1)
                  print(
                      "CLOUD COVER: reusing existing real GFS cycle",
                      existing_time,
                      cloud_cover_value,
                      "%"
                  )

          for cycle_index, cycle_dt in enumerate(candidate_cycles):
              if cloud_cycle is not None:
                  break

              # NOAA asks automated loops to wait 10 seconds between fetches
              # to avoid excessive requests. Do not delay the first request.
              if cycle_index > 0:
                  time.sleep(10)

              date_part = cycle_dt.strftime("%Y%m%d")
              hour_part = cycle_dt.strftime("%H")
              file_name = f"gfs.t{hour_part}z.pgrb2.1p00.f000"
              cloud_url_candidate = (
                  "https://nomads.ncep.noaa.gov/cgi-bin/filter_gfs_1p00.pl?"
                  + urllib.parse.urlencode({
                      "file": file_name,
                      "lev_entire_atmosphere": "on",
                      "var_TCDC": "on",
                      "subregion": "",
                      "leftlon": "0",
                      "rightlon": "359",
                      "toplat": "90",
                      "bottomlat": "-90",
                      "dir": f"/gfs.{date_part}/{hour_part}/atmos",
                  })
              )

              print(
                  "FETCHING GFS CLOUD COVER:",
                  date_part,
                  hour_part + "Z"
              )

              candidate_bytes = fetch_gfs_cloud(
                  cloud_url_candidate
              )

              if not candidate_bytes:
                  continue

              if candidate_bytes[:4] == b"GRIB":
                  cloud_grib = candidate_bytes
                  cloud_cycle = cycle_dt
                  cloud_url = cloud_url_candidate
                  break

              print(
                  "GFS cloud response was not GRIB; trying older cycle."
              )

          if cloud_grib is None or cloud_cycle is None:
              raise RuntimeError(
                  "NOAA/NCEP GFS cloud-cover data could not be downloaded "
