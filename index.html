<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>WORLD NEWS</title>

<style>
* {
  box-sizing: border-box;
}

html,
body {
  margin: 0;
  width: 100%;
  height: 100%;
  overflow: hidden;
  font-family:
    -apple-system,
    BlinkMacSystemFont,
    "Segoe UI",
    sans-serif;
  background: #dff7ff;
  color: #17384a;
}

body {
  display: flex;
  align-items: center;
  justify-content: center;
}

.world-news {
  width: min(94vw, 1100px);
  height: min(90vh, 760px);
  background: rgba(255,255,255,0.92);
  border: 2px solid rgba(255,255,255,0.95);
  border-radius: 22px;
  box-shadow:
    0 18px 50px rgba(38,120,155,0.22),
    inset 0 1px 0 rgba(255,255,255,1);
  overflow: hidden;
}

.titlebar {
  height: 64px;
  display: flex;
  align-items: center;
  padding: 0 24px;
  font-size: 25px;
  font-weight: 700;
  letter-spacing: 0.02em;
  background:
    linear-gradient(
      to bottom,
      #ffffff 0%,
      #eafaff 48%,
      #d7f3fc 100%
    );
  border-bottom: 1px solid #b9e2ef;
}

.news-icon {
  margin-right: 10px;
}

.grid {
  height: calc(100% - 64px);
  display: grid;
  grid-template-columns: 1fr 1fr 1fr;
  grid-template-rows: 1fr 1fr;
}

.tile {
  min-width: 0;
  min-height: 0;
  padding: 16px;
  border-right: 1px solid #b8dce8;
  border-bottom: 1px solid #b8dce8;
  overflow: hidden;
  background:
    linear-gradient(
      145deg,
      rgba(255,255,255,0.96),
      rgba(235,249,253,0.92)
    );
}

.tile:nth-child(3n) {
  border-right: none;
}

.tile:nth-child(n+4) {
  border-bottom: none;
}

.tile-title {
  height: 34px;
  display: flex;
  align-items: center;
  gap: 7px;
  font-size: 16px;
  font-weight: 700;
  color: #20566c;
  white-space: nowrap;
}

.tile-title .emoji {
  font-size: 19px;
}

.content {
  height: calc(100% - 34px);
  overflow: hidden;
  font-size: 14px;
}

.data-card {
  width: 100%;
  height: 100%;
  display: flex;
  flex-direction: column;
  justify-content: center;
  gap: 8px;
}

.main-value {
  font-size: 24px;
  font-weight: 700;
  color: #17627f;
}

.sub-value {
  font-size: 13px;
  color: #4d7180;
  line-height: 1.45;
}

.meta {
  font-size: 11px;
  color: #78919b;
  line-height: 1.4;
}

.image-card {
  width: 100%;
  height: 100%;
  display: flex;
  flex-direction: column;
  gap: 7px;
}

.image-card img {
  width: 100%;
  flex: 1;
  min-height: 0;
  object-fit: cover;
  border-radius: 11px;
  border: 1px solid #b8dce8;
  background: #d9f2fa;
}

.image-source {
  flex: 0 0 auto;
  font-size: 10px;
  color: #78919b;
}

.random-place {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 12px;
  height: 100%;
}

.place-info,
.place-weather {
  min-width: 0;
  display: flex;
  flex-direction: column;
  justify-content: center;
}

.place-name {
  font-size: 20px;
  font-weight: 700;
  color: #17627f;
  line-height: 1.2;
  overflow-wrap: anywhere;
}

.coordinates {
  margin-top: 5px;
  font-size: 10px;
  color: #78919b;
}

.weather-big {
  font-size: 22px;
  font-weight: 700;
  color: #237b61;
}

.weather-line {
  font-size: 12px;
  line-height: 1.45;
  color: #4d7180;
}

.space-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 8px 14px;
  height: 100%;
  align-content: center;
}

.space-item {
  min-width: 0;
}

.space-label {
  font-size: 10px;
  color: #78919b;
  text-transform: uppercase;
  letter-spacing: 0.04em;
}

.space-value {
  font-size: 15px;
  font-weight: 700;
  color: #17627f;
  margin-top: 2px;
  overflow-wrap: anywhere;
}

.no-data {
  display: flex;
  align-items: center;
  justify-content: center;
  height: 100%;
  color: #91aab3;
  font-size: 13px;
}

.updated {
  position: fixed;
  right: 10px;
  bottom: 7px;
  font-size: 9px;
  color: rgba(60,100,115,0.55);
}

@media (max-width: 700px) {
  .world-news {
    width: 96vw;
    height: 94vh;
    border-radius: 16px;
  }

  .titlebar {
    height: 54px;
    padding: 0 16px;
    font-size: 20px;
  }

  .grid {
    height: calc(100% - 54px);
  }

  .tile {
    padding: 10px;
  }

  .tile-title {
    font-size: 12px;
  }

  .tile-title .emoji {
    font-size: 15px;
  }

  .content {
    font-size: 11px;
  }

  .main-value {
    font-size: 18px;
  }

  .place-name {
    font-size: 15px;
  }

  .weather-big {
    font-size: 17px;
  }

  .space-value {
    font-size: 12px;
  }
}
</style>
</head>

<body>

<div class="world-news">

  <div class="titlebar">
    <span class="news-icon">📰</span>
    <span>WORLD NEWS</span>
  </div>

  <div class="grid">

    <!-- EARTH OBSERVATION -->
    <section class="tile">
      <div class="tile-title">
        <span class="emoji">🛰</span>
        <span>EARTH OBSERVATION</span>
      </div>

      <div class="content">
        <div class="image-card">
          <img
            id="earthImage"
            src="./world-media/earth.jpg"
            alt="NOAA GOES Earth observation"
          >
          <div class="image-source">
            NOAA GOES
          </div>
        </div>
      </div>
    </section>

    <!-- ATMOSPHERE -->
    <section class="tile">
      <div class="tile-title">
        <span class="emoji">🌬</span>
        <span>ATMOSPHERE</span>
      </div>

      <div class="content" id="atmosphere">
        <div class="no-data">LOADING...</div>
      </div>
    </section>

    <!-- MEDIA SIGNAL 01 -->
    <section class="tile">
      <div class="tile-title">
        <span class="emoji">📺</span>
        <span>MEDIA SIGNAL ①</span>
      </div>

      <div class="content">
        <div class="image-card">
          <img
            id="mediaImage1"
            src="./world-media/media1.jpg"
            alt="NOAA satellite media signal"
          >
          <div class="image-source">
            NOAA GOES
          </div>
        </div>
      </div>
    </section>

    <!-- RANDOM PLACE -->
    <section class="tile">
      <div class="tile-title">
        <span class="emoji">📍</span>
        <span>RANDOM PLACE</span>
      </div>

      <div class="content" id="randomPlace">
        <div class="no-data">LOADING...</div>
      </div>
    </section>

    <!-- SPACE WEATHER -->
    <section class="tile">
      <div class="tile-title">
        <span class="emoji">🌌</span>
        <span>SPACE WEATHER</span>
      </div>

      <div class="content" id="spaceWeather">
        <div class="no-data">LOADING...</div>
      </div>
    </section>

    <!-- MEDIA SIGNAL 02 -->
    <section class="tile">
      <div class="tile-title">
        <span class="emoji">📺</span>
        <span>MEDIA SIGNAL ②</span>
      </div>

      <div class="content">
        <div class="image-card">
          <img
            id="mediaImage2"
            src="./world-media/media2.jpg"
            alt="NOAA satellite media signal"
          >
          <div class="image-source">
            NOAA GOES
          </div>
        </div>
      </div>
    </section>

  </div>
</div>

<div class="updated" id="updated"></div>

<script>
const DATA_URL = "./world-data.json";

function escapeHTML(value) {
  if (value === null || value === undefined) {
    return "";
  }

  return String(value)
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#039;");
}

function valueOrNoData(value, suffix = "") {
  if (
    value === null ||
    value === undefined ||
    value === ""
  ) {
    return "NO DATA";
  }

  return escapeHTML(value) + suffix;
}

function formatTemperature(value) {
  if (value === null || value === undefined || value === "") {
    return "NO DATA";
  }

  return `${escapeHTML(value)} °C`;
}

function formatWind(speed, direction) {
  if (
    speed === null ||
    speed === undefined ||
    speed === ""
  ) {
    return "NO DATA";
  }

  let result = `${escapeHTML(speed)} kt`;

  if (
    direction !== null &&
    direction !== undefined &&
    direction !== ""
  ) {
    result += ` / ${escapeHTML(direction)}°`;
  }

  return result;
}

function renderAtmosphere(data) {
  const el = document.getElementById("atmosphere");

  if (!data) {
    el.innerHTML = `<div class="no-data">NO DATA</div>`;
    return;
  }

  el.innerHTML = `
    <div class="data-card">
      <div class="main-value">
        ${escapeHTML(data.station || "UNKNOWN")}
      </div>

      <div class="sub-value">
        ${escapeHTML(data.name || "UNKNOWN")}
      </div>

      <div class="sub-value">
        Temperature:
        ${formatTemperature(data.temperature)}
      </div>

      <div class="sub-value">
        Wind:
        ${formatWind(data.windSpeed, data.windDirection)}
      </div>

      <div class="sub-value">
        Visibility:
        ${valueOrNoData(data.visibility, " sm")}
      </div>

      <div class="meta">
        Observation:
        ${escapeHTML(data.observationTime || "NO DATA")}
      </div>
    </div>
  `;
}

function renderRandomPlace(data) {
  const el = document.getElementById("randomPlace");

  if (!data) {
    el.innerHTML = `<div class="no-data">NO DATA</div>`;
    return;
  }

  el.innerHTML = `
    <div class="random-place">

      <div class="place-info">
        <div class="place-name">
          ${escapeHTML(data.name || data.station || "UNKNOWN")}
        </div>

        <div class="coordinates">
          ${data.lat !== undefined ? escapeHTML(data.lat) : "NO DATA"},
          ${data.lon !== undefined ? escapeHTML(data.lon) : "NO DATA"}
        </div>

        <div class="meta">
          Station:
          ${escapeHTML(data.station || "NO DATA")}
        </div>
      </div>

      <div class="place-weather">
        <div class="weather-big">
          ${formatTemperature(data.temperature)}
        </div>

        <div class="weather-line">
          Weather:
          ${escapeHTML(data.weather || "NO DATA")}
        </div>

        <div class="weather-line">
          Wind:
          ${formatWind(data.windSpeed, data.windDirection)}
        </div>

        <div class="weather-line">
          Visibility:
          ${valueOrNoData(data.visibility, " sm")}
        </div>
      </div>

    </div>
  `;
}

function renderSpaceWeather(space) {
  const el = document.getElementById("spaceWeather");

  if (!space) {
    el.innerHTML = `<div class="no-data">NO DATA</div>`;
    return;
  }

  const solarWind = space.solarWind;
  const magneticField = space.magneticField;
  const kp = space.kp;
  const flux = space.flux10cm;

  let solarWindValue = "NO DATA";
  let magneticValue = "NO DATA";
  let kpValue = "NO DATA";
  let fluxValue = "NO DATA";

  if (solarWind && solarWind.proton_speed !== undefined) {
    solarWindValue =
      `${escapeHTML(solarWind.proton_speed)} km/s`;
  }

  if (magneticField && magneticField.bt !== undefined) {
    magneticValue =
      `${escapeHTML(magneticField.bt)} nT`;
  }

  if (kp && kp.Kp !== undefined) {
    kpValue =
      `Kp ${escapeHTML(kp.Kp)}`;
  }

  if (flux && flux.flux !== undefined) {
    fluxValue =
      `${escapeHTML(flux.flux)} sfu`;
  }

  let scaleValue = "NO DATA";

  if (space.scales) {
    const keys = Object.keys(space.scales);

    if (keys.length > 0) {
      const latestKey = keys
        .filter(key => key !== "-1")
        .sort((a, b) => Number(b) - Number(a))[0];

      if (
        latestKey !== undefined &&
        space.scales[latestKey]
      ) {
        const scale = space.scales[latestKey];

        const parts = [];

        if (scale.R && scale.R.Scale !== undefined) {
          parts.push(`R${scale.R.Scale}`);
        }

        if (scale.S && scale.S.Scale !== undefined) {
          parts.push(`S${scale.S.Scale}`);
        }

        if (scale.G && scale.G.Scale !== undefined) {
          parts.push(`G${scale.G.Scale}`);
        }

        if (parts.length) {
          scaleValue = parts.join(" / ");
        }
      }
    }
  }

  el.innerHTML = `
    <div class="space-grid">

      <div class="space-item">
        <div class="space-label">SOLAR WIND</div>
        <div class="space-value">${solarWindValue}</div>
      </div>

      <div class="space-item">
        <div class="space-label">MAGNETIC FIELD</div>
        <div class="space-value">${magneticValue}</div>
      </div>

      <div class="space-item">
        <div class="space-label">INTERPLANETARY</div>
        <div class="space-value">
          ${solarWind?.time_tag
            ? escapeHTML(solarWind.time_tag)
            : "NO DATA"}
        </div>
      </div>

      <div class="space-item">
        <div class="space-label">AURORA</div>
        <div class="space-value">
          ${space.aurora ? "AVAILABLE" : "NO DATA"}
        </div>
      </div>

      <div class="space-item">
        <div class="space-label">SOLAR ACTIVITY</div>
        <div class="space-value">${fluxValue}</div>
      </div>

      <div class="space-item">
        <div class="space-label">KP / SCALE</div>
        <div class="space-value">
          ${kpValue} / ${scaleValue}
        </div>
      </div>

    </div>
  `;
}

function setupImage(id, path) {
  const img = document.getElementById(id);

  if (!img || !path) {
    return;
  }

  img.src = `${path}?t=${Date.now()}`;

  img.onerror = () => {
    img.removeAttribute("src");
    img.alt = "NO DATA";
    img.style.display = "none";
  };
}

async function loadWorldData() {
  try {
    const response = await fetch(
      `${DATA_URL}?t=${Date.now()}`,
      {
        cache: "no-store"
      }
    );

    if (!response.ok) {
      throw new Error("world-data.json could not be loaded.");
    }

    const data = await response.json();

    renderAtmosphere(data.atmosphere);
    renderRandomPlace(data.randomPlace);
    renderSpaceWeather(data.space);

    if (data.images) {
      setupImage(
        "earthImage",
        data.images.earth
      );

      setupImage(
        "mediaImage1",
        data.images.media1
      );

      setupImage(
        "mediaImage2",
        data.images.media2
      );
    }

    const updated = document.getElementById("updated");

    if (updated && data.generatedAt) {
      updated.textContent =
        `DATA UPDATED ${data.generatedAt}`;
    }

  } catch (error) {
    console.error(error);

    document.getElementById("atmosphere").innerHTML =
      `<div class="no-data">NO DATA</div>`;

    document.getElementById("randomPlace").innerHTML =
      `<div class="no-data">NO DATA</div>`;

    document.getElementById("spaceWeather").innerHTML =
      `<div class="no-data">NO DATA</div>`;
  }
}

loadWorldData();

/*
  GitHub Actions側で更新された
  world-data.jsonを10分ごとに読み直す。
*/
setInterval(
  loadWorldData,
  10 * 60 * 1000
);
</script>

</body>
</html>
