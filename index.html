<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>WORLD NEWS</title>

<style>
* {
  box-sizing: border-box;
}

html,
body {
  margin: 0;
  width: 100%;
  height: 100%;
  overflow: hidden;
  font-family:
    -apple-system,
    BlinkMacSystemFont,
    "Segoe UI",
    sans-serif;
  background: #dff7ff;
  color: #17384a;
}

body {
  display: flex;
  align-items: center;
  justify-content: center;
}

.world-news {
  width: min(94vw, 1100px);
  height: min(90vh, 760px);
  background: rgba(255,255,255,0.92);
  border: 2px solid rgba(255,255,255,0.95);
  border-radius: 22px;
  box-shadow:
    0 18px 50px rgba(38,120,155,0.22),
    inset 0 1px 0 rgba(255,255,255,1);
  overflow: hidden;
}

.titlebar {
  height: 64px;
  display: flex;
  align-items: center;
  padding: 0 24px;
  font-size: 25px;
  font-weight: 700;
  letter-spacing: 0.02em;
  background:
    linear-gradient(
      to bottom,
      #ffffff 0%,
      #eafaff 48%,
      #d7f3fc 100%
    );
  border-bottom: 1px solid #b9e2ef;
}

.news-icon {
  margin-right: 10px;
}

.grid {
  height: calc(100% - 64px);
  display: grid;
  grid-template-columns: 1fr 1fr 1fr;
  grid-template-rows: 1fr 1fr;
}

.tile {
  min-width: 0;
  min-height: 0;
  padding: 16px;
  border-right: 1px solid #b8dce8;
  border-bottom: 1px solid #b8dce8;
  overflow: hidden;
  background:
    linear-gradient(
      145deg,
      rgba(255,255,255,0.96),
      rgba(235,249,253,0.92)
    );
}

.tile:nth-child(3n) {
  border-right: none;
}

.tile:nth-child(n+4) {
  border-bottom: none;
}

.tile-title {
  height: 34px;
  display: flex;
  align-items: center;
  gap: 7px;
  font-size: 16px;
  font-weight: 700;
  color: #20566c;
  white-space: nowrap;
}

.tile-title .emoji {
  font-size: 19px;
}

.content {
  height: calc(100% - 34px);
  overflow: hidden;
  font-size: 14px;
}

.data-card {
  width: 100%;
  height: 100%;
  display: flex;
  flex-direction: column;
  justify-content: center;
  gap: 8px;
}

.main-value {
  font-size: 24px;
  font-weight: 700;
  color: #17627f;
}

.sub-value {
  font-size: 13px;
  color: #4d7180;
  line-height: 1.45;
}

.meta {
  font-size: 11px;
  color: #78919b;
  line-height: 1.4;
}

.image-card {
  width: 100%;
  height: 100%;
  display: flex;
  flex-direction: column;
  gap: 7px;
}

.image-card img {
  width: 100%;
  flex: 1;
  min-height: 0;
  object-fit: cover;
  border-radius: 11px;
  border: 1px solid #b8dce8;
  background: #d9f2fa;
}

.image-source {
  flex: 0 0 auto;
  font-size: 10px;
  color: #78919b;
  overflow: hidden;
  white-space: nowrap;
  text-overflow: ellipsis;
}

.image-source a {
  color: inherit;
  text-decoration: none;
}

.image-source a:hover {
  text-decoration: underline;
}

.map-card {
  width: 100%;
  height: 100%;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 7px;
}

.map-frame {
  width: 78%;
  height: 100%;
  min-height: 0;
  border: 1px solid #b8dce8;
  border-radius: 11px;
  background: #d9f2fa;
}

.map-source {
  flex: 0 0 auto;
  font-size: 10px;
  color: #78919b;
}

.random-place {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 12px;
  height: 100%;
}

.place-info,
.place-weather {
  min-width: 0;
  display: flex;
  flex-direction: column;
  justify-content: center;
}

.place-name {
  font-size: 20px;
  font-weight: 700;
  color: #17627f;
  line-height: 1.2;
  overflow-wrap: anywhere;
}

.coordinates {
  margin-top: 5px;
  font-size: 10px;
  color: #78919b;
}

.weather-big {
  font-size: 22px;
  font-weight: 700;
  color: #237b61;
}

.weather-line {
  font-size: 12px;
  line-height: 1.45;
  color: #4d7180;
}

.space-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 8px 14px;
  height: 100%;
  align-content: center;
}

.space-item {
  min-width: 0;
}

.space-label {
  font-size: 10px;
  color: #78919b;
  text-transform: uppercase;
  letter-spacing: 0.04em;
}

.space-value {
  font-size: 15px;
  font-weight: 700;
  color: #17627f;
  margin-top: 2px;
  overflow-wrap: anywhere;
}

.no-data {
  display: flex;
  align-items: center;
  justify-content: center;
  height: 100%;
  color: #91aab3;
  font-size: 13px;
}

.updated {
  position: fixed;
  right: 10px;
  bottom: 7px;
  font-size: 9px;
  color: rgba(60,100,115,0.55);
}

@media (max-width: 700px) {
  .world-news {
    width: 96vw;
    height: 94vh;
    border-radius: 16px;
  }

  .titlebar {
    height: 54px;
    padding: 0 16px;
    font-size: 20px;
  }

  .grid {
    height: calc(100% - 54px);
  }

  .tile {
    padding: 10px;
  }

  .tile-title {
    font-size: 12px;
  }

  .tile-title .emoji {
    font-size: 15px;
  }

  .content {
    font-size: 11px;
  }

  .main-value {
    font-size: 18px;
  }

  .place-name {
    font-size: 15px;
  }

  .weather-big {
    font-size: 17px;
  }

  .space-value {
    font-size: 12px;
  }

  .map-frame {
    width: 82%;
  }
}
</style>
</head>

<body>

<div class="world-news">

  <div class="titlebar">
    <span class="news-icon">📰</span>
    <span>WORLD NEWS</span>
  </div>

  <div class="grid">

    <!-- EARTH OBSERVATION -->
    <section class="tile">
      <div class="tile-title">
        <span class="emoji">🌍</span>
        <span>EARTH OBSERVATION</span>
      </div>

      <div class="content">
        <div class="map-card">

          <iframe
            id="earthMap"
            class="map-frame"
            title="Random Place map"
            loading="lazy"
            src="about:blank"
          ></iframe>

          <div class="map-source">
            © OpenStreetMap contributors
          </div>

        </div>
      </div>
    </section>


    <!-- ATMOSPHERE -->
    <section class="tile">

      <div class="tile-title">
        <span class="emoji">🌬</span>
        <span>ATMOSPHERE</span>
      </div>

      <div
        class="content"
        id="atmosphere"
      >
        <div class="no-data">LOADING...</div>
      </div>

    </section>


    <!-- MEDIA SIGNAL 01 -->
    <section class="tile">

      <div class="tile-title">
        <span class="emoji">📺</span>
        <span>MEDIA SIGNAL ①</span>
      </div>

      <div class="content">

        <div class="image-card">

          <img
            id="mediaImage1"
            alt="World photograph"
          >

          <div
            class="image-source"
            id="mediaSource1"
          >
            LOADING...
          </div>

        </div>

      </div>
    </section>


    <!-- RANDOM PLACE -->
    <section class="tile">

      <div class="tile-title">
        <span class="emoji">📍</span>
        <span>RANDOM PLACE</span>
      </div>

      <div
        class="content"
        id="randomPlace"
      >
        <div class="no-data">LOADING...</div>
      </div>

    </section>


    <!-- SPACE WEATHER -->
    <section class="tile">

      <div class="tile-title">
        <span class="emoji">🌌</span>
        <span>SPACE WEATHER</span>
      </div>

      <div
        class="content"
        id="spaceWeather"
      >
        <div class="no-data">LOADING...</div>
      </div>

    </section>


    <!-- MEDIA SIGNAL 02 -->
    <section class="tile">

      <div class="tile-title">
        <span class="emoji">📺</span>
        <span>MEDIA SIGNAL ②</span>
      </div>

      <div class="content">

        <div class="image-card">

          <img
            id="mediaImage2"
            alt="Satellite or space image"
          >

          <div
            class="image-source"
            id="mediaSource2"
          >
            LOADING...
          </div>

        </div>

      </div>
    </section>

  </div>
</div>


<div
  class="updated"
  id="updated"
></div>


<script>

const DATA_URL = "./world-data.json";


/* =========================================================
   COMMON
========================================================= */

function escapeHTML(value) {

  if (
    value === null ||
    value === undefined
  ) {
    return "";
  }

  return String(value)
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#039;");

}


function valueOrNoData(
  value,
  suffix = ""
) {

  if (
    value === null ||
    value === undefined ||
    value === ""
  ) {
    return "NO DATA";
  }

  return escapeHTML(value) + suffix;

}


function formatTemperature(value) {

  if (
    value === null ||
    value === undefined ||
    value === ""
  ) {
    return "NO DATA";
  }

  return `${escapeHTML(value)} °C`;

}


function formatWind(
  speed,
  direction
) {

  if (
    speed === null ||
    speed === undefined ||
    speed === ""
  ) {
    return "NO DATA";
  }

  let result =
    `${escapeHTML(speed)} kt`;

  if (
    direction !== null &&
    direction !== undefined &&
    direction !== ""
  ) {

    result +=
      ` / ${escapeHTML(direction)}°`;

  }

  return result;

}


/* =========================================================
   ATMOSPHERE
========================================================= */

function renderAtmosphere(data) {

  const el =
    document.getElementById(
      "atmosphere"
    );

  if (!data) {

    el.innerHTML =
      `<div class="no-data">NO DATA</div>`;

    return;

  }

  el.innerHTML = `

    <div class="data-card">

      <div class="main-value">
        ${escapeHTML(
          data.station || "UNKNOWN"
        )}
      </div>

      <div class="sub-value">
        ${escapeHTML(
          data.name || "UNKNOWN"
        )}
      </div>

      <div class="sub-value">
        Temperature:
        ${formatTemperature(
          data.temperature
        )}
      </div>

      <div class="sub-value">
        Wind:
        ${formatWind(
          data.windSpeed,
          data.windDirection
        )}
      </div>

      <div class="sub-value">
        Visibility:
        ${valueOrNoData(
          data.visibility,
          " sm"
        )}
      </div>

      <div class="meta">
        Observation:
        ${escapeHTML(
          data.observationTime ||
          "NO DATA"
        )}
      </div>

    </div>

  `;

}


/* =========================================================
   RANDOM PLACE
========================================================= */

function renderRandomPlace(data) {

  const el =
    document.getElementById(
      "randomPlace"
    );

  if (!data) {

    el.innerHTML =
      `<div class="no-data">NO DATA</div>`;

    return;

  }

  el.innerHTML = `

    <div class="random-place">

      <div class="place-info">

        <div class="place-name">
          ${escapeHTML(
            data.name ||
            data.station ||
            "UNKNOWN"
          )}
        </div>

        <div class="coordinates">
          ${
            data.lat !== undefined
              ? escapeHTML(data.lat)
              : "NO DATA"
          },
          ${
            data.lon !== undefined
              ? escapeHTML(data.lon)
              : "NO DATA"
          }
        </div>

        <div class="meta">
          Station:
          ${escapeHTML(
            data.station ||
            "NO DATA"
          )}
        </div>

      </div>


      <div class="place-weather">

        <div class="weather-big">
          ${formatTemperature(
            data.temperature
          )}
        </div>

        <div class="weather-line">
          Weather:
          ${escapeHTML(
            data.weather ||
            "NO DATA"
          )}
        </div>

        <div class="weather-line">
          Wind:
          ${formatWind(
            data.windSpeed,
            data.windDirection
          )}
        </div>

        <div class="weather-line">
          Visibility:
          ${valueOrNoData(
            data.visibility,
            " sm"
          )}
        </div>

      </div>

    </div>

  `;

}


/* =========================================================
   OPENSTREETMAP
========================================================= */

function setupRandomPlaceMap(place) {

  const map =
    document.getElementById(
      "earthMap"
    );

  if (
    !map ||
    !place ||
    place.lat === undefined ||
    place.lon === undefined
  ) {
    return;
  }

  const lat =
    Number(place.lat);

  const lon =
    Number(place.lon);

  if (
    !Number.isFinite(lat) ||
    !Number.isFinite(lon)
  ) {
    return;
  }

  const deltaLon = 1.2;
  const deltaLat = 0.8;

  const left =
    lon - deltaLon;

  const right =
    lon + deltaLon;

  const bottom =
    lat - deltaLat;

  const top =
    lat + deltaLat;

  map.src =
    "https://www.openstreetmap.org/export/embed.html" +
    `?bbox=${encodeURIComponent(left)},${encodeURIComponent(bottom)},${encodeURIComponent(right)},${encodeURIComponent(top)}` +
    "&layer=mapnik" +
    `&marker=${encodeURIComponent(lat)},${encodeURIComponent(lon)}`;

}


/* =========================================================
   SPACE WEATHER
========================================================= */

function renderSpaceWeather(space) {

  const el =
    document.getElementById(
      "spaceWeather"
    );

  if (!space) {

    el.innerHTML =
      `<div class="no-data">NO DATA</div>`;

    return;

  }

  const solarWind =
    space.solarWind;

  const magneticField =
    space.magneticField;

  const kp =
    space.kp;

  const flux =
    space.flux10cm;


  let solarWindValue =
    "NO DATA";

  let magneticValue =
    "NO DATA";

  let kpValue =
    "NO DATA";

  let fluxValue =
    "NO DATA";


  if (solarWind) {

    if (
      solarWind.speed !==
      undefined
    ) {

      solarWindValue =
        `${escapeHTML(
          solarWind.speed
        )} km/s`;

    } else if (
      solarWind.proton_speed !==
      undefined
    ) {

      solarWindValue =
        `${escapeHTML(
          solarWind.proton_speed
        )} km/s`;

    }

  }


  if (
    magneticField &&
    magneticField.bt !==
    undefined
  ) {

    magneticValue =
      `${escapeHTML(
        magneticField.bt
      )} nT`;

  }


  if (kp) {

    if (
      kp.kp !==
      undefined
    ) {

      kpValue =
        `Kp ${escapeHTML(
          kp.kp
        )}`;

    } else if (
      kp.Kp !==
      undefined
    ) {

      kpValue =
        `Kp ${escapeHTML(
          kp.Kp
        )}`;

    }

  }


  if (
    flux &&
    flux.flux !==
    undefined
  ) {

    fluxValue =
      `${escapeHTML(
        flux.flux
      )} sfu`;

  }


  let interplanetaryTime =
    "NO DATA";


  if (solarWind) {

    if (
      solarWind.time !==
      undefined
    ) {

      interplanetaryTime =
        escapeHTML(
          solarWind.time
        );

    } else if (
      solarWind.time_tag !==
      undefined
    ) {

      interplanetaryTime =
        escapeHTML(
          solarWind.time_tag
        );

    }

  }


  el.innerHTML = `

    <div class="space-grid">

      <div class="space-item">

        <div class="space-label">
          SOLAR WIND
        </div>

        <div class="space-value">
          ${solarWindValue}
        </div>

      </div>


      <div class="space-item">

        <div class="space-label">
          MAGNETIC FIELD
        </div>

        <div class="space-value">
          ${magneticValue}
        </div>

      </div>


      <div class="space-item">

        <div class="space-label">
          INTERPLANETARY
        </div>

        <div class="space-value">
          ${interplanetaryTime}
        </div>

      </div>


      <div class="space-item">

        <div class="space-label">
          AURORA
        </div>

        <div class="space-value">
          NO DATA
        </div>

      </div>


      <div class="space-item">

        <div class="space-label">
          SOLAR ACTIVITY
        </div>

        <div class="space-value">
          ${fluxValue}
        </div>

      </div>


      <div class="space-item">

        <div class="space-label">
          KP
        </div>

        <div class="space-value">
          ${kpValue}
        </div>

      </div>

    </div>

  `;

}


/* =========================================================
   MEDIA SIGNAL ①
   LOCAL WORKFLOW IMAGE
   world-media/media1.jpg
========================================================= */

function renderMediaSignal1(data) {

  const img =
    document.getElementById(
      "mediaImage1"
    );

  const source =
    document.getElementById(
      "mediaSource1"
    );

  if (!img || !source) {
    return;
  }


  img.style.display =
    "block";


  const imagePath =
    data &&
    data.images &&
    data.images.media1
      ? data.images.media1
      : "./world-media/media1.jpg";


  img.src =
    `${imagePath}?t=${Date.now()}`;


  img.alt =
    "World photograph";


  const metadata =
    data &&
    data.mediaSignal1
      ? data.mediaSignal1
      : null;


  if (metadata) {

    const artist =
      metadata.artist
        ? `${metadata.artist} · `
        : "";

    const license =
      metadata.license ||
      "";

    const page =
      metadata.page ||
      "";

    if (page) {

      source.innerHTML =
        `${escapeHTML(artist)}` +
        `${escapeHTML(license)}` +
        ` · ` +
        `<a href="${escapeHTML(page)}" target="_blank" rel="noopener noreferrer">Wikimedia Commons</a>`;

    } else {

      source.textContent =
        `${artist}${license}`;

    }

  } else {

    source.textContent =
      "Wikimedia Commons";

  }


  img.onerror =
    () => {

      img.removeAttribute(
        "src"
      );

      img.alt =
        "NO DATA";

      img.style.display =
        "none";

      source.textContent =
        "NO DATA";

    };

}


/* =========================================================
   MEDIA SIGNAL ②
   LOCAL WORKFLOW IMAGE
   world-media/media2.jpg
========================================================= */

function renderMediaSignal2(data) {

  const img =
    document.getElementById(
      "mediaImage2"
    );

  const source =
    document.getElementById(
      "mediaSource2"
    );

  if (!img || !source) {
    return;
  }


  img.style.display =
    "block";


  const imagePath =
    data &&
    data.images &&
    data.images.media2
      ? data.images.media2
      : "./world-media/media2.jpg";


  img.src =
    `${imagePath}?t=${Date.now()}`;


  img.alt =
    "Satellite or space image";


  const metadata =
    data &&
    data.mediaSignal2
      ? data.mediaSignal2
      : null;


  if (metadata) {

    const sourceName =
      metadata.source ||
      "Satellite / Space imagery";

    const title =
      metadata.title
        ? ` · ${metadata.title}`
        : "";

    source.textContent =
      `${sourceName}${title}`;

  } else {

    source.textContent =
      "Satellite / Space imagery";

  }


  img.onerror =
    () => {

      img.removeAttribute(
        "src"
      );

      img.alt =
        "NO DATA";

      img.style.display =
        "none";

      source.textContent =
        "NO DATA";

    };

}


/* =========================================================
   WORLD DATA
========================================================= */

async function loadWorldData() {

  try {

    const response =
      await fetch(
        `${DATA_URL}?t=${Date.now()}`,
        {
          cache: "no-store"
        }
      );


    if (!response.ok) {

      throw new Error(
        "world-data.json could not be loaded."
      );

    }


    const data =
      await response.json();


    renderAtmosphere(
      data.atmosphere
    );


    renderRandomPlace(
      data.randomPlace
    );


    /*
      EARTH OBSERVATIONの地図は
      RANDOM PLACEと同じ座標を使用。
    */
    setupRandomPlaceMap(
      data.randomPlace
    );


    renderSpaceWeather(
      data.space
    );


    /*
      MEDIA SIGNAL ①②は
      workflowが生成したローカル画像を使用。
    */
    renderMediaSignal1(
      data
    );


    renderMediaSignal2(
      data
    );


    const updated =
      document.getElementById(
        "updated"
      );


    if (
      updated &&
      data.generatedAt
    ) {

      updated.textContent =
        `DATA UPDATED ${data.generatedAt}`;

    }


  } catch (error) {

    console.error(
      error
    );


    document.getElementById(
      "atmosphere"
    ).innerHTML =
      `<div class="no-data">NO DATA</div>`;


    document.getElementById(
      "randomPlace"
    ).innerHTML =
      `<div class="no-data">NO DATA</div>`;


    document.getElementById(
      "spaceWeather"
    ).innerHTML =
      `<div class="no-data">NO DATA</div>`;


    /*
      world-data.jsonが失敗した場合でも、
      画像自体はローカルパスから表示を試みる。
    */
    renderMediaSignal1(
      null
    );

    renderMediaSignal2(
      null
    );

  }

}


/* =========================================================
   INITIAL LOAD
========================================================= */

loadWorldData();


/*
  10分ごとにWORLD NEWSのデータを更新。
  MEDIA SIGNAL ①②も同時に新しい画像へ更新。
*/

setInterval(
  loadWorldData,
  10 * 60 * 1000
);

</script>

</body>
</html>
